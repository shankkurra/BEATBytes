<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BEATBytes</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --navy:#0B1E36;--navy2:#12294A;--ink:#16202E;--muted:#68758A;--faint:#98A2B3;
  --bg:#F5F6FA;--surface:#FFFFFF;--line:#E6E9F0;--hair:#EEF0F5;
  --accent:#2E5AAC;--green:#177A4C;--green-soft:#E7F5EE;--amber:#9A6700;--amber-soft:#FCF3E1;--red:#B3261E;
  --mon:#4650B8;--tue:#177A4C;--wed:#6B3FA0;--thu:#B26A00;--fri:#B03A6E;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.05);
  --shadow2:0 2px 4px rgba(16,24,40,.06),0 10px 28px rgba(16,24,40,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,'Segoe UI',Arial,sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.side{width:232px;background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:26px 18px 20px}
.logo{font-size:19px;font-weight:800;letter-spacing:-.3px}
.logo small{display:block;font-size:10.5px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;color:#8FA3C4;margin-top:4px}
.nav{margin-top:34px;display:flex;flex-direction:column;gap:4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:#C6D2E5;font-size:13.5px;font-weight:600;transition:background .15s,color .15s}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.active{background:rgba(255,255,255,.13);color:#fff}
.nav .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55}
.sidefoot{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding-top:14px}
.sidefoot button{all:unset;cursor:pointer;font-size:12px;color:#9FB2CF;font-weight:600}
.sidefoot button:hover{color:#fff}
.main{margin-left:232px;flex:1;padding:38px 46px 70px;max-width:1120px}
@media(max-width:880px){.side{position:static;width:100%;flex-direction:row;align-items:center;padding:14px 18px}.nav{margin:0 0 0 18px;flex-direction:row}.sidefoot{display:none}.app{flex-direction:column}.main{margin:0;padding:22px 16px}}
/* ---------- primitives ---------- */
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.main>*{animation:rise .25s ease both}
h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint)}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.lift{transition:box-shadow .18s,transform .18s}
.lift:hover{box-shadow:var(--shadow2)}
.btn{all:unset;cursor:pointer;font-weight:600;font-size:13px;padding:9px 16px;border-radius:9px;transition:filter .12s,transform .05s;text-align:center}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:hover{filter:brightness(1.15)}
.btn.quiet{background:#EEF1F6;color:var(--ink)}
.btn.quiet:hover{background:#E4E8F0}
.btn.ghost{color:var(--muted);padding:9px 10px}
.btn.ghost:hover{color:var(--ink)}
.pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;letter-spacing:.2px;white-space:nowrap}
.pill.sent{background:var(--green-soft);color:var(--green)}
.pill.tpl{background:var(--amber-soft);color:var(--amber)}
.pill.chart{background:#EAF0FB;color:var(--accent)}
.pill.miss{background:#FDECEC;color:var(--red)}
.pill.up{background:#EDF1FA;color:var(--accent)}
.pill.MKT{background:#EDEEFC;color:var(--mon)}.pill.TCA{background:#E7F5EE;color:var(--tue)}
.pill.ALGO{background:#F2ECFA;color:var(--wed)}.pill.BEATBOT{background:#FBF1E2;color:var(--thu)}.pill.QUIZ{background:#FBEAF2;color:var(--fri)}
.idc{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--faint)}
.a-MKT{border-left:4px solid var(--mon)}.a-TCA{border-left:4px solid var(--tue)}
.a-ALGO{border-left:4px solid var(--wed)}.a-BEATBOT{border-left:4px solid var(--thu)}.a-QUIZ{border-left:4px solid var(--fri)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow2);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.toast.show{opacity:1}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.search{width:100%;max-width:420px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:13.5px;background:#fff}
.search:focus{outline:2px solid #C9D6EE;border-color:var(--accent)}
/* ---------- today ---------- */
.hero{padding:26px 30px}
.msghead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.copyline{font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:600;color:var(--navy);background:#F2F5FA;border:1px solid var(--hair);border-radius:8px;padding:9px 13px;white-space:pre-wrap;word-break:break-word}
.msgtext{white-space:pre-wrap;font-size:14px;color:#233042;margin-top:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.flagline{margin-top:12px;font-size:12.5px;color:var(--amber);font-weight:600}
.wk{margin-top:34px}
.wkrow{display:flex;align-items:center;gap:16px;padding:15px 20px;border-top:1px solid var(--hair)}
.wkrow:first-of-type{border-top:none}
.wkrow.today-row{background:#FAFBFF}
.wkday{width:104px;flex:none}
.wkday b{display:block;font-size:13.5px}
.wkday span{font-size:11.5px;color:var(--faint)}
.thcol{width:152px;flex:none;display:flex}
.thcol .pill{width:100%;text-align:center}
.wkmain{flex:1;min-width:0}
.wkmain b{font-size:13.5px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wkmain span{font-size:12px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wkact{flex:none;display:flex;align-items:center;gap:10px}
/* ---------- library ---------- */
.dayblock{margin-top:16px;overflow:hidden}
.dayhead{display:flex;align-items:center;gap:12px;padding:17px 22px;cursor:pointer;user-select:none}
.dayhead:hover{background:#FAFBFD}
.dayhead .dd{width:9px;height:9px;border-radius:50%}
.dayhead b{font-size:15px;font-weight:700;flex:1}
.dayhead .cnt{font-size:12px;color:var(--faint);font-weight:600}
.chev{transition:transform .18s;color:var(--faint);font-size:12px}
.open>.dayhead .chev{transform:rotate(90deg)}
.topichead{display:flex;align-items:center;gap:10px;padding:11px 22px;background:#F8F9FC;border-top:1px solid var(--hair);cursor:pointer;font-weight:700;font-size:12.5px;letter-spacing:.4px;text-transform:uppercase;color:#40506B}
.topichead:hover{background:#F2F4F9}
.topichead .cnt{font-weight:600;color:var(--faint);text-transform:none;letter-spacing:0}
.byterow{padding:12px 22px 12px 34px;border-top:1px solid var(--hair);cursor:pointer}
.byterow:hover{background:#FCFCFE}
.byterow .t{display:flex;align-items:center;gap:10px}
.byterow .t b{font-size:13.5px;font-weight:600;flex:1}
.bytebody{padding:4px 22px 18px 34px;border-top:1px dashed var(--hair);background:#FDFDFF}
/* ---------- schedule / about ---------- */
.schedrow{display:flex;align-items:center;gap:16px;padding:16px 22px;border-top:1px solid var(--hair)}
.schedrow:first-of-type{border-top:none}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px;margin:18px 0 24px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px 16px;box-shadow:var(--shadow)}
.stat .n{font-size:23px;font-weight:800;letter-spacing:-.5px}
.stat .l{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--faint);margin-top:2px}
.prose{padding:24px 28px;font-size:13.8px;color:#2A3648}
.prose h3{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint);margin:22px 0 8px}
.prose h3:first-child{margin-top:0}
.kbd{font-family:ui-monospace,Menlo,monospace;background:#F2F5FA;border:1px solid var(--hair);border-radius:6px;padding:2px 7px;font-size:12.5px}
table.log{width:100%;border-collapse:collapse;font-size:13px}
table.log th{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);text-align:left;padding:10px 16px;border-bottom:1px solid var(--line)}
table.log td{padding:9px 16px;border-bottom:1px solid var(--hair)}
</style></head><body>
<div class="app">
  <aside class="side">
    <div class="logo">BEATBytes<small>Berenberg Electronic Trading</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot"><button onclick="copyLink()">Copy dashboard link</button></div>
  </aside>
  <main class="main" id="content"></main>
</div>
<div class="toast" id="toast"></div>
<script>
const DATA={"bytes": [{"id": "MKT-001", "theme": "MKT", "title": "Dark Makeup In Europe", "topic": "Dark Trading", "text": "How are dark volumes fragmented across Europe and what venue is gaining market share this year? Dark volume has consistently made up circa [10% \u2013 update] of on exchange market share, there are 6 non exchange ran dark venues. CBOE makes up x% of overall dark venues up to July this year, an increase from x% we saw in 202x. See attached chart..What drives this?", "template": true, "chart": true, "lastSent": "2024-07-27"}, {"id": "MKT-002", "theme": "MKT", "title": "Different Dark Venues", "topic": "Dark Trading", "text": "Europe has x venues that offer dark trading, some cater to different order types and each has its own unique trading mechanisms. Here is a summary of each mechanisms and the order types each offers.", "template": true, "chart": false, "lastSent": "2023-10-16"}, {"id": "MKT-003", "theme": "MKT", "title": "Monthly Dark Share Record", "topic": "Dark Trading", "text": "Dark venues contributed x% of on-exchange market share in [Month] \u2013 the lowest/highest/inline since the inception of MiFID II.\nTo put the market share shift into context, the yearly average for the last four years has been around x%, making it almost a x% increase from what we have seen historically.\n- What is behind the shift? There is not one clear reason for the change; we believe it is down to a multitude of factors.\n- Relaxing of DVCs\n- New exchanges running dark venues (ENXT / BME / Xetra in [2024 \u2013 update]) prompted brokers to change SOR activity to sweep dark before lit.\n- A trend in the reduction of lit market share continues as more participants focus on reducing costs.", "template": true, "chart": false, "lastSent": ""}, {"id": "MKT-004", "theme": "MKT", "title": "Dark's Steady 10%", "topic": "Dark Trading", "text": "Dark volume has consistently made up circa [10% \u2013 update] of on exchange market share over the last 5 years.\n\nWhat venue(s) are gaining/losing market share this year when compared with 202x?\n\nLOSERS\n*TURQ x%\n*SIGMA -x%\n*POSIT -x%\n*AQUIS -x%\n\nGAINERS\n*CBOE +x%\n*LIQU +x%\n*INSTINET +x%\n*NORDIC @ MID +x%\n\nSee attached chart which displays the fragmentation of dark volume in Europe.", "template": true, "chart": true, "lastSent": ""}, {"id": "MKT-005", "theme": "MKT", "title": "Where Dark Blocks Print", "topic": "Dark Trading", "text": "Where are the blocks in the dark taking place? CBOE dominate the LIS market with x% market share, followed by Liquidnet with x%. Liquidnet has lost share over the past few years down from x%.", "template": true, "chart": false, "lastSent": "2023-07-17"}, {"id": "MKT-006", "theme": "MKT", "title": "Blocks Beyond Dark Venues", "topic": "Dark Trading", "text": "Traditionally we view dark venues as to where the \"block\" trades happen but increasingly we are seeing year on year average trade size decreased to \u20acx from \u20acx.", "template": true, "chart": false, "lastSent": "2024-11-25"}, {"id": "MKT-007", "theme": "MKT", "title": "Dark Turnover: Steady ~10.6%", "topic": "Dark Trading", "text": "Current dark turnover in Europe averages x% of daily on venue volume YTD.\nIn the UK, where the FCA has removed Double Volume Caps (DVCs), that figure is notably higher at x% YTD.\nUnlike lit markets, where volume tends to build towards the close, dark trading is front-loaded: Roughly x% of daily dark turnover occurs in the first hour of the trading day.\nThis coincides with periods of wider spreads and lower top of book depth \u2014 typically less favorable execution conditions.\nThe second-largest dark activity window is 14:00\u201315:00 (UK time), accounting for approximately x% of daily dark volume, driven by increased activity around the U.S. market open.\nThis data provides valuable insight for Portfolio Managers. If orders can be generated and released earlier in the session \u2014 particularly ahead of peak dark activity \u2014 there may be opportunities to improve fill rates and reduce slippage, even in challenging liquidity conditions.", "template": true, "chart": false, "lastSent": ""}, {"id": "MKT-008", "theme": "MKT", "title": "CBOE LIS: Above-LIS Only", "topic": "Dark Trading", "text": "CBOE LIS\n\nCBOE LIS is the only dark venue that has a submission size > LIS and now accounts for more than x% market share of the LIS dark market, what has helped drive its success?\n\nWhen a trades occurs either bilaterally between two buyside firms or with a broker and one buyside, the designated broker model allows buy side traders to allocate a broker of their choosing to settle the trade who capture a commission for doing so.\n\nThis combined with the high adoption across brokers has helped CBOEs LIS venue retain market share in dark blocks larger than LIS.\n\nBerenberg is a designated broker on CBOE. Reach out to your coverage if you would like to get us setup for your next trade!", "template": true, "chart": false, "lastSent": null}, {"id": "MKT-009", "theme": "MKT", "title": "Dark Trade Sizes (B2B)", "topic": "Dark Trading", "text": "How has the average trade size in dark venues facilitating buyside-to-buyside trading evolved over time?\n\nSince [2018 \u2013 update], the average trade size has increased/declined from \u20acxk to \u20acxk in 202x, marking the lowest level recorded between [2018 \u2013 update] and [2024 \u2013 update]. However, trade sizes have decreased/rebounded this year, reaching \u20acxk.\n\nWhat\u2019s driving this change?", "template": true, "chart": false, "lastSent": ""}, {"id": "MKT-010", "theme": "MKT", "title": "Average Trade Size Over Time In Dark", "topic": "Dark Trading", "text": "How big are trades that take place on dark pools and how have sizes trended throughout the years since MIFID II? The average dark trade size for 202x was \u20acx. Which is +/-x% the avg size in 202x. See chart attached for trends in avg dark sizes.", "template": true, "chart": true, "lastSent": "2024-02-26"}, {"id": "MKT-011", "theme": "MKT", "title": "Periodic Auction Growth", "topic": "Periodic Auctions", "text": "Periodic auctions have grown x% since inception and now account for x% of total on exchange trading, CBOE still holds the crown for the most volume traded in this venue category accounting for x% of periodic auction volumes. Periodic auctions have seen large growth due to the DVC mechanism in europe which prohibits dark trading in venues sub LIS in capped stocks. Large banks also preference this venue to internally cross up flow at a cheap rate that cant be internalised due to regulatory reasons.", "template": true, "chart": false, "lastSent": "2023-10-25"}, {"id": "MKT-012", "theme": "MKT", "title": "The Age Of Dark Trading Is Over", "topic": "Periodic Auctions", "text": "Periodic auctions, for the first time since their inception, now account for a larger share of continuous market volume than dark MTFs.\nSince the launch of the Single Volume Cap (SVC) on October 14th, which restricts dark trading across all EU venues to [7% \u2013 update], down from [8% \u2013 update] under the legacy DVC, more stocks have been suspended.\nFrom the inception date highlighted on the chart below, we can observe that periodic auction volumes have risen to approximately [16% \u2013 update] of continuous market share, while dark venues account for only around [13% \u2013 update].\nThis raises the question: how long until the regulator considers imposing a threshold limit on periodic auction venues?", "template": true, "chart": true, "lastSent": ""}, {"id": "MKT-013", "theme": "MKT", "title": "Displayed Trading in Periodic Auctions", "topic": "Periodic Auctions", "text": "How much of displayed trading takes place in periodic auctions?\n\nPeriodic auctions were actively trading after MIFID II was introduced in [2018 \u2013 update], they made up just under [3% \u2013 update] of overall displayed volumes in the Stoxx 600.\n\nSince inception the venue category has seen consistent year on year growth reaching x% in 202x and currently making up x% of displayed volumes in 202x.\n\nWhat is behind this rate of growth?\n\nPassive trading strategies where flow is matched between two counterparts executed by the same broker which can't be internalised.", "template": true, "chart": false, "lastSent": ""}, {"id": "MKT-014", "theme": "MKT", "title": "Periodic Auctions in Continuous Trading", "topic": "Periodic Auctions", "text": "With 202x in the rear view mirror has the growth in periodic auctions held up? They made up x% of displayed trading in continuous. The highest ever since their inception in 201x.", "template": true, "chart": false, "lastSent": "2024-01-08"}, {"id": "MKT-015", "theme": "MKT", "title": "How Periodic Auctions Work", "topic": "Periodic Auctions", "text": "How does a periodic auction work and how different are the venues? CBOE is the largest venue in the space with 75% market share, its venue works slightly different to the others. When an order is entered into the venue the call phase starts, at this point other participants can enter orders. The call phase then ends randomly and uncrosses at a price between EBBO. The other periodic auction venues work slightly differently, when two orders match the call phase is started as opposed to when the first order is entered in CBOE.", "template": false, "chart": false, "lastSent": "2023-07-10"}, {"id": "MKT-016", "theme": "MKT", "title": "Aquis Overtakes Sigma", "topic": "Periodic Auctions", "text": "Since the acquisition of UBS's MTF Aquis has been growing its market share in the periodic auction space. Sigma was previously the 2nd largest venue in Europe has now been dethroned by Aquis. See attached chart of shifts in market share.", "template": false, "chart": true, "lastSent": "2024-03-18"}, {"id": "MKT-017", "theme": "MKT", "title": "Year in Review: Venue Shift", "topic": "Venue Categories", "text": "As the year draws to a close, we\u2019ve seen a notable shift in venue mix across European exchanges.\nGrowth in primary closing auctions has stalled this year, with heightened volatility diverting volume into other continuous trading venues.\nPeriodic auctions reached record levels and now account for around [9% \u2013 update] of total market share. Notably, in several months towards year-end, their turnover exceeded that of all dark venues combined across Europe.\nLit trading continues to represent a shrinking share of overall activity, with the primary market now contributing just [37% \u2013 update], down from over [50% \u2013 update] in [2020 \u2013 update].", "template": true, "chart": false, "lastSent": ""}, {"id": "MKT-018", "theme": "MKT", "title": "Venue Category Distribution", "topic": "Venue Categories", "text": "The attached chart illustrates the distribution of market share across the four venue categories in continuous trading since [2020 \u2013 update].\nA clear trend has emerged: primary venues are consistently losing market share.\nThis shift is driven by the growing popularity of periodic auctions and dark venues, as market participants increasingly turn to them to reduce explicit trading costs, minimise signalling risk, and improve liquidity capture.\nMeanwhile, lit MTFs have gained market share, supported by incentive schemes that reward brokers with rebates for passively providing liquidity.", "template": true, "chart": true, "lastSent": ""}, {"id": "MKT-019", "theme": "MKT", "title": "Venue Differentiation", "topic": "Venue Categories", "text": "BEATs venue differentiators:\n\nPeriodic Auctions: By leveraging our liquidity partners broker prioritisation in these venues, Berenberg fill nearly 20% of liquidity seeking orders in Periodic Auctions vs. the market avg (3%) due to our unique routing structure.\n\nBank SI\u2019s: BEAT are one of the few brokers in Europe that aggregates CRB flow, benefiting from unique unwind and systematic flows for liquidity seeking strategies.\n\nLiS: BEATs agnostic routing and firm order placement results in quicker matches and a higher fill rate in LIQU and ITG Posit.\n\nELP SI\u2019s: Berenberg is one of the few brokers in Europe that accesses SI\u2019s on its dark route. We connect to 8 ELPs using an All-or-None fill strategy.", "template": false, "chart": false, "lastSent": ""}, {"id": "MKT-020", "theme": "MKT", "title": "On vs Off Exchange Split", "topic": "Off Exchange", "text": "How is value traded in Europe split between trades that take place on-exchange (lit, dark, FBA, and auction) and trades agreed off-exchange, such as crosses, interactions with an SI, and retail networks?\nComparing January \u2013 [current month] over the last eight years, there is a clear trend of more price-forming volume moving off-exchange.\nLast year, X% of all value traded in Europe took place off-exchange, compared with x% in 20x.\nThis year, more value has traded on-exchange than in the previous two years, driven by increased volatility bringing more volume back onto exchange.", "template": true, "chart": false, "lastSent": ""}, {"id": "MKT-021", "theme": "MKT", "title": "Addressable vs Reported Volume", "topic": "Off Exchange", "text": "Addressable volume in Europe makes up around x% of the total reported volume the other x% takes place off exchange. The x% that takes place off exchange has a large amount of trades that are not price forming up to half of all off exchange volume is classified as non price forming trades. What are the non price forming trades? These can be give ups and technical trades that are not part of trading individual client orders.", "template": true, "chart": false, "lastSent": null}, {"id": "MKT-022", "theme": "MKT", "title": "On vs Off-Exchange Volume Mix", "topic": "Off Exchange", "text": "OFF & ON EXCH VOLUMES\n\nAs volumes decline in Europe, how has the make up of on/off-exchange volumes changed over the last few years?\n\nOff-exchange volumes made up x% of all price forming trades in 202x, a large increase from x% the year prior. It's clear looking at the attached graph there is a noticeable trend of volumes shifting off-exchange.\n\nThis is driven by a combination of increased bilateral trading arrangements, as well increased internalisation. It's also worth highlighting that there is still a significant proportion of volume that does not get reported that takes place off-exchange due to reporting technicalities (e.g. some give up trades).", "template": true, "chart": true, "lastSent": "2026-01-26"}, {"id": "MKT-023", "theme": "MKT", "title": "Quarter End", "topic": "Quarterly Comparison", "text": "As we approach quarter end how has this quarter compared with previous years in terms of volumes and volatility? The last four Q3s averaged \u20acbn of ADVT on exchange compared with Q323 \u20acbn (a quiet/busty Q3!). The average return on the SXXP was x% compared with Q323. [Month] end auction volume is expected to be (modest/large) looking at previous years.", "template": true, "chart": false, "lastSent": "2023-10-30"}, {"id": "MKT-024", "theme": "MKT", "title": "Monthly Volumes in the Quarter", "topic": "Quarterly Comparison", "text": "As we enter this quarter how did volume fare in [Month] vs historic averages? Average Daily Value Traded (ADVT) in [Month] 202x was \u20acxm vs \u20acxm in 202x. An in/decrease of x%.", "template": true, "chart": false, "lastSent": "2023-11-01"}, {"id": "MKT-025", "theme": "MKT", "title": "Quarterly ADVT vs History", "topic": "Quarterly Comparison", "text": "Average Daily Value Traded (ADVT) on exchange in Qx this year was \u20acxbn, the lowest/highest in x years, as volatility increased/declined on the V2X. The first month of Qx has been more promising with ADVT of \u20acxbn a x% increase when compared with Qx's ADVT.\n\nQx is off to a good start in terms of volumes compared to last year's \u20acxbn ADVT.", "template": true, "chart": false, "lastSent": null}, {"id": "MKT-026", "theme": "MKT", "title": "Entering the Final Quarter", "topic": "Quarterly Comparison", "text": "As we enter the final quarter of 202x, how does Qx compare to historical volumes?\n\nAverage daily value traded (ADVT) in Qx was \u20acxbn, a x% decrease compared with Qx and Qx this year which averaged roughly \u20acxbn.\n\nQx 202x was x% higher vs Qx 202x (\u20acxbn). The x year Qx average for value traded on-exchange is \u20acxbn, making Qx-2x a x% increase vs the x yr avg.", "template": true, "chart": false, "lastSent": null}, {"id": "MKT-027", "theme": "MKT", "title": "Quarterly ADVT: Multi-Year Low", "topic": "Quarterly Comparison", "text": "Average Daily Value Traded (ADVT) on exchange in Qx this year was the lowest in x years at \u20acxbn \u2013 how did Qx compare?\n\nADVT in Qx reached \u20acxm a modest QoQ increase of x%, when compared to previous Qxs this is the lowest value going back to 201x.\n\nVolumes in Qx were given a boost by the increased volatility we had in the beginning of the quarter the V2X averaged x compared to Qxs x.", "template": true, "chart": false, "lastSent": null}, {"id": "MKT-028", "theme": "MKT", "title": "Q2 Index Turnover", "topic": "Quarterly Comparison", "text": "On average in Qx this year the following indexes turned over a daily notional of FTSE 100 \u20acxbn, CAC 40 \u20acxbn, DAX\u20acxbn, IBEX 35 \u20acxbn and OMXC20 \u20acxbn. For context the US traded $xm daily on average in Qx.", "template": true, "chart": false, "lastSent": "2024-07-08"}, {"id": "MKT-029", "theme": "MKT", "title": "Average Volume Stats", "topic": "Quarterly Comparison", "text": "Average Daily Value Traded (ADVT) in Qx this year was the lowest in 5 years, the first month of Qx was more promising which posted an ADVT of \u20acxbn a x% increase when compared with Q+xs ADVT of \u20acxbn. It's worth highlighting we will have the MSCI rebalance at the end of this month which will help drive volumes.", "template": true, "chart": false, "lastSent": "2024-06-03"}, {"id": "MKT-030", "theme": "MKT", "title": "Quarter Comparison", "topic": "Quarterly Comparison", "text": "With the first week of Qx behind us. How did volumes in Qx compare with previous quarters? Qx 2x average daily value traded (ADVT) on exchange was \u20acxbn a x% increase/decrease when compared with Qx . The five year average for ADVT in Q1 is \u20acxbn, this years Q1 was x% lower.", "template": true, "chart": false, "lastSent": null}, {"id": "MKT-031", "theme": "MKT", "title": "Q3 vs Prior Quarters", "topic": "Quarterly Comparison", "text": "As we reach the the end of Qx, how have trading volumes compared to previous quarters?\nAverage Daily Value Traded (ADVT) in Qx 202x reached ~\u20acxbn, an x% increase year-on-year compared to ~\u20acxbn in Q3 202x.\nLooking back historically to 201x, this marks the highest Qx volume on record, despite a backdrop of lower volatility compared to previous quarters.", "template": true, "chart": false, "lastSent": ""}, {"id": "MKT-032", "theme": "MKT", "title": "Monthly Volumes in Context", "topic": "Monthly Comparison", "text": "How did volumes in [Month] compare historically?\nAverage Daily Value Traded (ADVT) on exchange was \u20acxbn the highest level since the introduction of MiFID II in 201x.\nMonths figure was also x% higher than the 202x year-to-date ADVT of \u20acxbn.\nAs we enter August which is typically the slowest month of Qx it will be interesting to see whether volumes continue their upward trajectory.", "template": true, "chart": false, "lastSent": ""}, {"id": "MKT-033", "theme": "MKT", "title": "Volumes & Spreads", "topic": "Monthly Comparison", "text": "As we approach the first month of 202x does it look like volumes are going to bounce back? Volumes in January to date when looking at average daily value traded (ADVT) on exchange have increased/decreased in comparison to January last year and the [2023 \u2013 update] average of xbn.", "template": true, "chart": false, "lastSent": "2024-01-29"}, {"id": "MKT-034", "theme": "MKT", "title": "Monthly Volume Rebound", "topic": "Monthly Comparison", "text": "After a quiet/busy [Month], volumes increased x% in X driven by traders returning to the office and the rebalance on date xx.", "template": true, "chart": false, "lastSent": "2023-10-02"}, {"id": "MKT-035", "theme": "MKT", "title": "First Full Week of January", "topic": "Monthly Comparison", "text": "As we enter the first full trading week of x - What can we expect volumes to look like?\n\nx historically has seen volumes x% higher/lower than the previous month of x on average.\n\nDecember averaged \u20acxbn last year, to put that number in context the 202x average was \u20acxbn\n\nWorth noting we have an extra US holiday this month on the 9th in addition to the MLK on the 15th.", "template": true, "chart": false, "lastSent": "2026-01-12"}, {"id": "MKT-036", "theme": "MKT", "title": "Halfway Point: Volume Shift", "topic": "Monthly Comparison", "text": "Halfway into x, how have volumes across Europe changed since x, which is typically the quietest month?\n\nThe average daily value traded (ADVT) on exchange in x was \u20acxbn, which is x% lower than the 202x year-to-date average of \u20acxbn. X volumes, so far this month, have averaged \u20acxbn\u2014a x% increase compared to X.\n\nWhen we put these numbers in perspective by comparing this year\u2019s ADVT to the same point last year, volumes are up slightly year on year. The 202x year-to-date average is approximately \u20acxbn, compared to last year\u2019s \u20acxbn.", "template": true, "chart": false, "lastSent": null}, {"id": "MKT-037", "theme": "MKT", "title": "Last Month in Context", "topic": "Monthly Comparison", "text": "* How did last month\u2019s volume compare historically? *\n\n- The on-exchange Average Daily Value Traded (ADVT) in October was \u20acxbn, a x% decrease from x \u20acxbn.\n\n- [Month] 202x showed a x% increase compared to October 202x, which averaged \u20acxbn.\n\n- The 5-year X ADVT is \u20acXbn, placing x 202x x% above average.\n\n* Year-To-Date, how do volumes compare historically? *\n\n- YTD ADVT on-exchange is \u20acxbn, up x% from last year\u2019s \u20acxbn at the end of X.\n\n- The 5-year ADVT YTD ([Month]-[Month]) is \u20acXbn, landing last month\u2019s figure X% below the historical X-year average.", "template": true, "chart": false, "lastSent": null}, {"id": "MKT-038", "theme": "MKT", "title": "Monthly ADVT Recap", "topic": "Monthly Comparison", "text": "Average daily value traded (ADVT) in [Month] was \u20acxbn, a x% in/decrease compared with [Month].\n\n[Month] 202x was x% high/lower vs X 202X (\u20acxbn). The X year [Month] average forvalue traded on-exchange is \u20acxbn, making month 24 a x% de/increase vs the 5 yr avg.", "template": true, "chart": false, "lastSent": null}, {"id": "MKT-039", "theme": "MKT", "title": "December Trading Volumes", "topic": "Monthly Comparison", "text": "As we enter the final weeks of the year, how do they compare to the rest of the year in terms of average daily value trade (ADVT) on exchange? Trading volumes in December are typically down x% on the years average, the last x  years ADVT was \u20acxbn compare to \u20acxbn.", "template": true, "chart": false, "lastSent": "2024-12-09"}, {"id": "MKT-040", "theme": "MKT", "title": "Volume Trends In August/Mid September", "topic": "Monthly Comparison", "text": "Half way into [Month] - how have volumes across Europe changed since X which is typically the quietest month. Average daily value traded on exchange in August was \u20acxbn which is x% when compared to the YTD average. September volumes so far this month have averaged \u20acbn a x% in/decrease when compared to X.", "template": true, "chart": false, "lastSent": "2024-09-16"}, {"id": "MKT-041", "theme": "MKT", "title": "Strong Start to the Year", "topic": "Monthly Comparison", "text": "The average daily value traded (ADVT) on exchange in January and February was \u20acXbn across Europe.\nTo put this in perspective, the combined ADVT for January and February last year was \u20acXbn.\nThis represents a X% year-on-year increase, making the start of QX stronger than the first two months of Q1 [2022 \u2013 update], when the Ukraine\u2013Russia conflict broke out.", "template": true, "chart": false, "lastSent": ""}, {"id": "MKT-042", "theme": "MKT", "title": "YTD ADVT Tracker", "topic": "Yearly Comparison", "text": "Average Daily Value Traded (ADVT) on exchange in X was \u20acXbn bringing the YTD ADVT to \u20acXbn\n\nHow does this compare to previous years so far? ADVT at this point last year was \u20acXbn an increase of X% Boring! Its worth highlighting that off exchange volumes have grown massively in comparison to 202X YTD off exchange price forming volume accounts for \u20acXbn daily up from \u20acXbn last year.", "template": true, "chart": false, "lastSent": null}, {"id": "MKT-043", "theme": "MKT", "title": "Europe ADVT YTD", "topic": "Yearly Comparison", "text": "Average daily value traded (ADVT) on exchange in Europe so far this X has been approximately \u20acx billion, representing a x% increase in volumes compared with the same period last year.\nMarket volatility has remained relatively subdued, with V2X trading around x versus a five-year average of x.\nThe sharp rise in trading volumes is likely driven by a combination of factors: a rotation of flows from the US into Europe, sector rotation within Europe itself, and a surge in earnings reports this month.", "template": true, "chart": false, "lastSent": ""}, {"id": "MKT-044", "theme": "MKT", "title": "Year-End Volume Pace", "topic": "Yearly Comparison", "text": "As we enter the final month of the year, trading activity remains well ahead of last year\u2019s pace.\nAverage daily value traded on exchange is up X% YTD compared with the same period last year.\nDecember typically sees softer activity, with average daily turnover of around \u20acXbn which is ~X% lower than the rest of the year.\nActivity usually slows further in the final week, and last year volumes during that period were X% lower than the full year average.", "template": true, "chart": false, "lastSent": ""}, {"id": "MKT-045", "theme": "MKT", "title": "More Volumes In Europe", "topic": "Bank Holiday", "text": "I HAVE A DREAM.. MORE VOLUMES IN EUROPE\n\nThe average daily value traded (ADVT) on exchange going back the last X MLK day holidays is \u20acXbn. To put in perspective the ADVT on exchange since 201X in the month of January is \u20acXbn, meaning that volumes are typically down X% from their monthly average on the US holiday.\n\nHow are volumes in Europe looking so far this year?\n\nSubdued.. The first two weeks of 202X ADVT was \u20acXbn (-[11% \u2013 update] yoy) the lowest turnover of value in January going back to 201X. N.B we do have two full weeks of trading left!", "template": true, "chart": false, "lastSent": ""}, {"id": "MKT-046", "theme": "MKT", "title": "Bank Holiday Volumes", "topic": "Bank Holiday", "text": "How low were volumes yesterday with the UK bank holiday?\nAverage Daily Value Traded (ADVT) came in at just \u20acXbn on exchange, reflecting the holiday slowdown.\nFor context:\n- Last week\u2019s ADVT averaged \u20acXbn, meaning yesterday was down X% week-on-week.\n- Compared to the year-to-date average, volumes were X% lower.", "template": true, "chart": false, "lastSent": null}, {"id": "MKT-047", "theme": "MKT", "title": "Presidents Day: Light Volumes", "topic": "Bank Holiday", "text": "Expect volumes to be light today with the US closed for Presidents day.\n\nLast year there was X% volume delta between presidents day and the previous days trading.\n\nContinuous volumes on exchange holiday days tend to see a large delta decrease vs. the avg closing auction volume. This can be as a result of orders back tilting towards the close.", "template": true, "chart": false, "lastSent": null}, {"id": "MKT-048", "theme": "MKT", "title": "Daytime Savings Volume Curves", "topic": "Bank Holiday", "text": "Last week the US opened in an hour earlier due to the clocks going backwards first in Europe. What consequence does this have on the volume profiles in Europe? The volume spike typically seen at 1430 shifts backwards to 1330 and volume was backweighted less.", "template": true, "chart": false, "lastSent": "2024-11-05"}, {"id": "MKT-049", "theme": "MKT", "title": "Closing Auction Share", "topic": "Closing Auctions", "text": "How do 202x closing auction volumes as % of overall on-exchange volumes compare to 202x?\n\n** 202x YTD **\n- DAX: x% ([2023 \u2013 update] x%)\n- FTSE: x% ([2023 \u2013 update] x%)\n- STOXX 600: x% ([2023 \u2013 update] x%)\n\nThe rise in closing auction market share is driven by the growth of passive trading strategies tied to ETFs and delta one desks, as well as the growing prevalence of electronic execution that concentrates volumes near the close.", "template": true, "chart": false, "lastSent": ""}, {"id": "MKT-050", "theme": "MKT", "title": "Quarter-End Close Volumes", "topic": "Closing Auctions", "text": "What will closing auction volumes look like this quarter end?\n\nOn average looking at the last x quarter ends the closing auction volume in the SXXP 600 is circa \u20acxbn or x% of on exchange volume.\n\nTo put in perspective YTD the closing auction on average makes up x% of on exchange volumes.", "template": true, "chart": false, "lastSent": ""}, {"id": "MKT-051", "theme": "MKT", "title": "SXXP Close Volumes", "topic": "Closing Auctions", "text": "In 202x closing auction volumes in the SXXP increased by ~x% year-on-year, to a total of x% of closing auction volumes. Be sure not to miss out on what is increasingly becoming a good source of liquidity in the close by using our Target Close strategy.\n\nTarget Close uses advanced volume prediction models to predict the closing auction volumes on the day. The algo will dynamically adjust the volume prediction throughout the day, which dictates whether your order will start early in continuous and at what time it should start.\n\nPlease reach out to your coverage for more details.", "template": true, "chart": false, "lastSent": ""}, {"id": "MKT-052", "theme": "MKT", "title": "Closing Auction Share YTD", "topic": "Closing Auctions", "text": "Closing auctions year-to-date account for x% of on-exchange volumes, slightly lower than the x% recorded in 202x.\nThis decline reflects the increased volatility throughout the year, as large price moves attract active investors to trade more frequently during continuous.", "template": true, "chart": false, "lastSent": ""}, {"id": "MKT-053", "theme": "MKT", "title": "Closing Auction Volumes", "topic": "Closing Auctions", "text": "Closing auction volumes in the SXXP made up x% of the on exchange volume traded, how does this vary in other indexes?", "template": true, "chart": false, "lastSent": "2024-02-12"}, {"id": "MKT-054", "theme": "MKT", "title": "Close vs Continuous Dislocations", "topic": "Closing Auctions", "text": "How have dislocations from last continuous to the closing price across the SXXP changed as the closing auction becomes a larger part of trading volumes?\n\nThe table below shows increasing closing auction market share has not caused a significant impact on last-close dislocations.\n\nThe larger dislocations are more apparent during periods of heightened volatility for example [2020 \u2013 update] (COV-19) and [2022 \u2013 update] (Russia-Ukraine) have the highest dislocations.", "template": true, "chart": false, "lastSent": ""}, {"id": "MKT-055", "theme": "MKT", "title": "Closing Auction Volume Shift", "topic": "Closing Auctions", "text": "In X - closing auction volumes decreased/increased on Pan-European Venues by ~X% to a total of x%. Be sure not to miss out on what is increasing becoming a good source of liquidity in the close by using our Target Close strategy.\n\nTarget Close uses advanced volume prediction models to predict the closing auction volumes on the day. Dynamically adjusting the prediction throughout the day.\n\nLeverage BEAT auction limit ref prices during the closing auction:\n\n- Last cont. price\n- iVWAP\n- Last 5 min VWAP\n- Average px\n\nSpeak to your BEAT coverage on how to set up the customisation for your style of trading.", "template": true, "chart": false, "lastSent": null}, {"id": "MKT-056", "theme": "MKT", "title": "What Did We TAL You?", "topic": "TAL", "text": "What did we TAL you?\n\nGoing into 202x, we have seen an increase of TAL volume. Only 2 weeks into [Month], TAL volume has increased [3% \u2013 update] year on year.\n\nThis is driven by a push from exchanges, increase of broker interaction as technology catches up with the mechanisms/automating interaction and shifting perception of TAL from bring viewed as a mechanism used to clean up orders with small residuals to its use as an additional source of liquidity.\n\n{OS}\nThis is similar to Snowball effect, as volumes increases, we see willingness to interact with this liquidity increase as well.\n\nYou can interact with TAL through BEAT by sending SOR with closing price limit.", "template": true, "chart": false, "lastSent": null}, {"id": "MKT-057", "theme": "MKT", "title": "The Rise of TAL", "topic": "TAL", "text": "Trading at last has gathered a lot of attention over the last few years. Exchanges have created a lot of different order types to try and capture more of liquidity that takes place around the close.\n\nThe ACMs and TAL mechanisms are as follows\n\nTAL on exchange (202x ADVT \u20acxm)\n\nAquis Market At Close & Cboe 3C (202x ADVT \u20acxm) are alternative closing mechanisms which provide cheaper alternatives of order matching at the closing price. The vast majority of this flow is made up of banks netting off flow.\n\nTurquoise Trade At Last (202x ADVT <\u20acxm) is a dark venue that only trades at the closing price\n\nGrowth\n\nWe've seen TAL and ACMs grow to x% of total lit market at the end of 202x share up from x% in 201x. That\u2019s a large increase!", "template": true, "chart": false, "lastSent": "2023-07-03"}, {"id": "MKT-058", "theme": "MKT", "title": "ELP Space YoY", "topic": "ELPs", "text": "How has the ELP space changed over the course of 202x vs [2022 \u2013 update]? XTX and Citadel dominated the space last year, we have seen recent upticks in volumes from Jane St as they reenter the equities space.", "template": true, "chart": false, "lastSent": "2023-10-23"}, {"id": "MKT-059", "theme": "MKT", "title": "Jane Street's Equities Return", "topic": "ELPs", "text": "Jane Street have made a return to equities, data shows their ADVT has increased x% are they doing bilateral trading with clients like Optiver?", "template": true, "chart": false, "lastSent": "2023-08-31"}, {"id": "MKT-060", "theme": "MKT", "title": "Spread Changes with Volatility Swings", "topic": "Spreads", "text": "How have spreads changed throughout 202X with the changes in volatility? QX 202X avg spread was xbps vs xbps in 202X.", "template": true, "chart": false, "lastSent": "2023-11-13"}, {"id": "MKT-061", "theme": "MKT", "title": "Touch Sizes", "topic": "Spreads", "text": "What is the average touch size in Europe and how does it differ across different European markets and venue categories?", "template": false, "chart": false, "lastSent": "2023-08-28"}, {"id": "MKT-062", "theme": "MKT", "title": "MSCI Rebal", "topic": "MSCI", "text": "The MSCI rebal will take place on the close tomorrow, what can we expect in terms of closing auction volumes? Its worth highlighting that MSCI changed the way the indexes were rebalanced at the start of [2023 \u2013 update] which aimed to make the four yearly rebalances equal in size. May last year the close represented X% of on exchange volumes and the last rebalance in February the closing auction accounted for X% of market volumes.", "template": true, "chart": false, "lastSent": "2024-05-30"}, {"id": "MKT-063", "theme": "MKT", "title": "Algo Wheels", "topic": "Other", "text": "Have algo wheels changed the market for the better or the worse? Algo wheels which automatically select brokers based on a pre determined criteria or weighting have automated trading that would have previously be done manually. The flow in wheels varies between firm but there are a lot of users of wheels that have created them for flow that does not require trader input allowing buyside desks to add move value to larger trades.", "template": false, "chart": false, "lastSent": "2024-06-17"}, {"id": "MKT-064", "theme": "MKT", "title": "Maker Taker", "topic": "Other", "text": "What is a maker taker model and why does it exist? Maker taker venues incentivise users to post by rebating them for providing passive liquidity.\nFor example: A counterparty who posts 100 shares worth \u20ac1550 passively on the offer that is then executed will receive a 0.15bp rebate (2 cents) and the taker will pay a fee of 0.3bps (5 cents). Which venues offer this in Europe currently?", "template": false, "chart": false, "lastSent": "2024-09-23"}, {"id": "TCA-001", "theme": "TCA", "title": "Alpha: Arrival to Close", "topic": "Benchmark", "text": "Alpha Arrival-Close, measures the move in bps from arrival to the last print of the trading day irrespective of when the order finishes. Why is this useful? The value gives you an idea of how the stock moved into the close. If your orders exhibit momentum or reversion.", "template": false, "chart": false, "lastSent": "2024-09-17"}, {"id": "TCA-002", "theme": "TCA", "title": "Slippage vs Arrival", "topic": "Benchmark", "text": "Slippage vs arrival is a common benchmark used to measure implicit trading costs.\n\nPerformance vs the closing price is often over looked when comparing liquidity seeking strategies traded intraday.\n\nWhy is it useful?\n\nA large delta between your avg price and the close price indicates there was momentum post trade.\n\nIf you are consistently underperforming the closing price its likely that there was reversion after completion of your orders.", "template": false, "chart": false, "lastSent": "2024-05-21"}, {"id": "TCA-003", "theme": "TCA", "title": "Comparing iVWAP Across Brokers", "topic": "Benchmark", "text": "While you can compare raw iVWAP slippage across brokers it's worth looking at other factors when making comparisons in performance.\n\n*Spread adjusted performance - relativises VWAP slippage by the size of the spread\n*Spread capture - will help you ascertain if you are paying spread too much or are achieving lower spread capture by trading mostly with SI venues in cost focused SORs as opposed to trading passively\n*Bucket orders by different characteristics such as time sent, ADV, spread and market cap.\n*Markouts post trade - allows you to see the magnitude of adverse selection when trading passively.", "template": false, "chart": false, "lastSent": ""}, {"id": "TCA-004", "theme": "TCA", "title": "Do You Look at iVWAP as a Benchmark?", "topic": "Benchmark", "text": "Do you look at iVWAP as a benchmark?\n\nIt's worth considering spread normalised iVWAP performance to relativise performance in stocks with wider spreads. This can be calculated by dividing your iVWAP slippage in bps by the historical spread of the stock.\n\nFor example, on a group of orders with an average spread of 6bps and iVWAP performance of +0.2bps. Spread adjusted performance would be 0.2/6 bringing you to a value of 0.03 or 3% of spread... A useful get out of jail card if your performance doesn't look too great! While you can compare raw iVWAP slippage its worth looking at other factors when making comparisons in performance. A) Spread adjusted performance - relativise vwap slippage by the size of the spread B) Spread capture - are you paying spread or preferencing SI venues in cost aligned SORs C) Bucket by time sent, VWAP orders sent towards the back end of the trading day will tend to have tighter slippage due to be backweighted to the close D) Bucket by aDV.", "template": false, "chart": false, "lastSent": "2024-07-09"}, {"id": "TCA-005", "theme": "TCA", "title": "EBEX", "topic": "Benchmark", "text": "EBEX EXPLAINED\n\n** What is EBEX? **\nEBEX is a benchmark that measures the execution quality of an order by taking into account the price achieved by other market participants during the trading interval, indirectly adjusting for the trading conditions and market regimes.\n\n** Why use EBEX? **\nUnlike a price benchmark, such as Arrival Mid, EBEX provides a relative measure of execution quality. I.e. an order with an EBEX score of 10% is objectively worse than one with a score of 80%. This isn't the case for every benchmark, for instance an order with a Arrival slippage of 20 bps may be better than one with a slippage of 5bps when taking into account spreads, broader market moves, and trading regimes.\n\n** How is EBEX calculated? **\nEBEX looks at the total market volume traded at a better price than your average execution price divided by the total market volume during several time intervals.\n\nEBEX = 1 - (sum of mkt volume traded at a better price than your average price) / (sum of the total market volume).\n\nFor example, for a buy order with avg px of \u20ac100, assume the mkt volume (including your own traded volume) consists of 300shs traded above \u20ac100 and 700shs traded below \u20ac100, the EBEX is 1 - 700/1000 = 1 - 0.7 = 30%.\n\nThis benchmark can be broken down into a \"BEFORE\" the end of the trade EBEX, and \"AFTER\" the end of the trade EBEX, to give an idea of whether the trade should have been more aggressive or more passive by looking at the EBEX price at different time intervals\n\nReach out to your coverage for any additional information.", "template": false, "chart": false, "lastSent": "2024-01-30"}, {"id": "TCA-006", "theme": "TCA", "title": "How Do You Weight Your TCA Results?", "topic": "Benchmark", "text": "How do you weight your TCA results? Notionally or by count?\n\nAs more and more buy side have become\u00a0\"data\" focused its important we take into account the way results are weighted.\n\nWhile the industry standard has been to notionally weight results, more and more firms are taking into account a count based model. Its often notionally weighted results can be skewed due to one or two larger orders.\n\nBerenbergs Trading Information Analytics (TIA) can quickly toggle results between count and notionally weightings to detect outliers in the group of trades.\n\nIf you would like a FY23 TCA report please reach out to your coverage!", "template": false, "chart": false, "lastSent": "2024-09-24"}, {"id": "TCA-007", "theme": "TCA", "title": "PWP", "topic": "Benchmark", "text": "What is PWP and why is it useful?\n\nPWP or Participation Weighted Price (often displayed PWP5, PWP10, PWP15,...) is used to compare the average price of your execution against the volume weighted price for a certain participation rate.\n\nIt is calculated much like a VWAP price, except the end time for the calculation window is dictated by how much volume has traded in the the market.\n\nFor instance, suppose an order of 100k shares. The PWP10 benchmark will be the VWAP price of the first 1m mkt shares from arrival, its PWP5 would be the VWAP of the first 2mio shares from arrival. Why is this useful?\n\nYou can compare your average price vs different PWP benchmarks to determine whether slowing down or speeding up would have benefited your execution. If your order (buy) completed at an average price of 100 with a participation rate of 30%, and PWP15 was 99 and PWP10 was 98.5. It would have benefited you to slow down your trading and participate with a lower part rate.", "template": false, "chart": false, "lastSent": "2024-11-26"}, {"id": "TCA-008", "theme": "TCA", "title": "Spread-Adjusted VWAP Performance", "topic": "Benchmark", "text": "To adjust for trading difficulty in wider spread stocks it can help to adjust VWAP by spread. This is done by dividing VWAP slippage by the stocks historical spread to put the slippage in perspective of spread. For example -1bp slippage on a 6bp stock translates to -0.16 or 16% of spread.", "template": false, "chart": false, "lastSent": "2024-06-11"}, {"id": "TCA-009", "theme": "TCA", "title": "Winsorising Outliers", "topic": "Benchmark", "text": "Do you winsorise your data when making comparisons across brokers?\n\nIn large datasets, outliers often skew averages. For instance, when looking at arrival performance across a large subset of orders, there may be a few orders that have a large deviation from arrival due to exogenous factors.\nBy winsorising, the upper and lower percentile of the dataset is adjusted, and has less effect on the average.\n\nBerenberg's TIA can winsorise your trading performance for you. Reach out to your coverage for more details.", "template": false, "chart": false, "lastSent": ""}, {"id": "TCA-010", "theme": "TCA", "title": "Alpha Last Fill To Close", "topic": "Alpha and Momentum", "text": "Are you completing your orders too early or perhaps trading too fast? When quantifying performance for arrival based strategies by looking at the alpha from your last fill to close we can get a good idea of how the stock traded post order completion. If there is an inherent pattern of negative alpha (stock moves favourably) after last fill up until the close this could be used as an indication that we had impact. One would expect the same group of orders to underperform smaller PWP benchmarks vs your POV.", "template": false, "chart": false, "lastSent": "2023-10-03"}, {"id": "TCA-011", "theme": "TCA", "title": "Profiling: Momentum or Impact", "topic": "Alpha and Momentum", "text": "When profiling order flow it can sometimes be difficult to understand if order momentum is a result to the underlying stock or relative index exhibiting alpha or the trading strategy creating impact.\nBy looking at market adjusted benchmarks we can get a good idea whether there was a market move intrade that influenced performance.\nLast fill to close alpha (the move in bps from last fill to close) helps us understand if the momentum continued post trade. If there is significant reversion post execution on a large enough dataset, its likely that there was some impact from trading.", "template": false, "chart": false, "lastSent": ""}, {"id": "TCA-012", "theme": "TCA", "title": "What Is Order Alpha?", "topic": "Alpha and Momentum", "text": "What is alpha in respect to TCA and why is it important?\n\nA trade with \u201calpha\u201d is an order which exhibit\u2019s momentum in the direction of trade (buy order goes up) the movement is usually referenced from arrival of the order.\n\nFor example an order with an arrival of 100 and a last fill of 101, would have an in trade alpha of 100bps.\n\nOther measures of alpha will include alpha to close, alpha arrival to first fill and alpha open to arrival (pre trade momo)\n\nWhere there is alpha in the direction of trade this is referred to as positive alpha, favourable movement vs arrival is known as negative alpha.\n\nBerenberg can build alpha \u201cprofiles\u201d for specific client flow which is then used to fine tune algo behaviour.", "template": false, "chart": false, "lastSent": "2024-03-12"}, {"id": "TCA-013", "theme": "TCA", "title": "Noisy Arrival Spreads", "topic": "Costs and Spread capture", "text": "Spread on arrival can be noisy and influenced by various factors such as time of day, volume changes and macro data. It's more accurate and a better comparison to use historic spread over a consistent period of time for example 5d,15d and 30d averages. This will help reduce noise from spread taken at the touch from arrival.", "template": false, "chart": false, "lastSent": "2024-10-22"}, {"id": "TCA-014", "theme": "TCA", "title": "Spread Capture and Passivity", "topic": "Costs and Spread capture", "text": "What is spread capture and what can it tell you about your execution?\n\nA spread capture of 100% is achieved by a passive fill on the near touch, 50% would be trading at mids in a non displayed venue, and 0% when you remove the far touch.\n\nScheduled strategies such as VWAP tend to have higher spread capture. The strategy initially sits passive, waits, and only crosses spread when it has to keep up with its target curve/volume.\n\nLiquidity seekers (depending on urgency) typically have lower spread capture due to more fills taking place at midpoint and far touch to interact with a wider pool of liquidity.\n\nBerenberg's TIA can display spread capture across various different buckets; algo, adv, market cap, spread, order size and many more.\n\nReach out to your coverage for more details.", "template": false, "chart": false, "lastSent": "2024-07-16"}, {"id": "TCA-015", "theme": "TCA", "title": "Implicit vs Explicit Costs", "topic": "Costs and Spread capture", "text": "What is the difference between an implicit and explicit cost?\n\nImplicit costs are costs associated with trading impact, for example a large ADV order in a wide spread name is likely to have larger implicit costs.\n\nExplicit costs are the costs known pre trade such as exchange, clearing and tax costs associated with execution.\n\nPlease contact your coverage about our TCA product TIA, which offers valuable insights into your implicit trading costs.", "template": false, "chart": false, "lastSent": "2024-10-01"}, {"id": "TCA-016", "theme": "TCA", "title": "Hit Rate vs Fill Rate", "topic": "Fill & Hit rates", "text": "What is the difference between hit rate and fill rate?\n\nHit rate is calculated as the amount of orders divided by number of fills. For example if you send 5 child orders and receive a fill on one of the orders your hit rate is 20%.\n\nFill rate is calculated by dividing the shares filled by the shares sent to that venue. For example a 500shs fill on a child of 1k is a fill rate of 50%.\n\nWhy is this useful?\n\nWhen comparing SOR tactics hit rate and fill rate are a good measure of liquidity capture and fill probability.When taking liquidity a fill rate close to 100% wold mean that you are capturing all marketable volume. Hit rate is a good way of looking at how often you are placed on the correct venue etc.", "template": false, "chart": false, "lastSent": "2026-01-20"}, {"id": "TCA-017", "theme": "TCA", "title": "Adverse Selection", "topic": "Mark Outs & Impact", "text": "What is adverse selection? Adverse selection occurs when there is one side of trade that has an information advantage. In the context of trading it typically refers to a counterparty placed passively and an aggressor who trades with the passively posted counterpart on the basis that they have knowledge of something that the counterpart sata passively doesn't.. A good example of this is size of trade, a counterpart sat passively does not know the size of the aggressor. If.", "template": false, "chart": false, "lastSent": "2024-07-28"}, {"id": "TCA-018", "theme": "TCA", "title": "Execution Reversion", "topic": "Mark Outs & Impact", "text": "Reversion can be defined as the move in a stock relative to a fill which can be measured in a few different ways, parent level reversion which looks at reversion post last fill of an order as well as child order reversion which looks at reversion post individual trade fills which can be bucketed by venue category. Why do we look at this? Parent order reversion gives us a good idea wether we have had impact intrade which is then reversed post completion. Child order reversion by venue category allows us to spot how particular venues act post execution.", "template": false, "chart": false, "lastSent": "2024-04-16"}, {"id": "TCA-019", "theme": "TCA", "title": "Mark Outs", "topic": "Mark Outs & Impact", "text": "A mark out assesses how a stock's midpoint price changes after an execution across different time intervals.\n\n** Why is this useful? **\n\nMark outs highlight venues or venue categories that are exhibiting signalling during the execution horizon and those where adverse selection is taking place.\n\n** When presented with the option to trade with multiple venues when crossing the spread to take liquidity, should you take into account historic mark outs of each venue? **\n\nIt depends on the strategy and urgency of the child order. In scenarios where an algo is behind and need to catch up to volume, it is common for historic mark outs to hold less influence over venue selection.\nWhen an order is sensitive to signalling risk, in a lower urgency venue mark outs will likely be taken into account when selecting venues.", "template": false, "chart": false, "lastSent": ""}, {"id": "TCA-020", "theme": "TCA", "title": "Momentum and Mean Reversion", "topic": "Mark Outs & Impact", "text": "What is the difference between momentum and mean reversion?\n\nMomentum refers to the tendency of stock prices to continue moving in the same direction for a period of time. A stock trending upwards or downwards consistently over a specific time frame is classed a stock which exhibits momentum.\n\nMean reversion is the concept that stock prices will eventually return to their mean. For example a stock that moves aggressively after the open but eventually reverts back to the stocks long term average price or \"fair value\".", "template": false, "chart": false, "lastSent": "2026-01-27"}, {"id": "TCA-021", "theme": "TCA", "title": "Midpoint Move Odds by Size", "topic": "Mark Outs & Impact", "text": "What is the probability the midpoint moves post dark execution? See below as you increase the execution size the probability of that move decreases due to interacting with healthier types of liquidity. Decrease your urgency in Ultra, Ultra Dark and Optimus to increase Min Exec Sizes, minimising impact, leakage of information and the chance of a midpoint move. Small ($1-5k) 36.5\nMedium ($5-10k) 32.6\nMedium II ($10-25k) 31.6\nLarge ($25-50k) 29.3\nLarge II ($50-100k) 22.9\nBlock ($100k +) 15.5.", "template": false, "chart": true, "lastSent": ""}, {"id": "TCA-022", "theme": "TCA", "title": "Average Fill Value", "topic": "Mark Outs & Impact", "text": "How do execution mark outs vary with trade size? The chart below shows the move in midpoint after a trade across a dataset of orders with various fill sizes. A positive move indicates the stock moving in the direction of trade, whats clear is that as trade size increases the move post trade decreases. Trading algos will balance the risk of signalling with trade size depending on urgency and lifetime of an order. If there is no immediate need to trade its likely that smaller trades will not be interacted with.", "template": false, "chart": true, "lastSent": "2024-07-02"}, {"id": "TCA-023", "theme": "TCA", "title": "Venue Choice When Crossing", "topic": "Mark Outs & Impact", "text": "When presented with the option to trade with multiple venues when crossing the spread to take liquidity should you take into account historic mark outs of each venue?\n\nThis should all depend on strategy and urgency of the child order. In scenarios where an algo is behind and capturing volume it is common for the historic mark outs to hold less influence over venue selection. When an order is sensitive to signalling risk, its imperative that before going to venues which exhibit large mark outs other non displayed venues and venues with smaller mark outs are interacted with first.\n\nIn addition to above, it is important to consider the trade off between timing risk and impact. It can be more costly to miss available liquidity vs adverse selection caused from an execution.", "template": false, "chart": false, "lastSent": "2023-10-24"}, {"id": "TCA-024", "theme": "TCA", "title": "Box Plots", "topic": "Methodology & Statistics", "text": "A box plot displays the distribution of outcomes of a data set. The example attached shows a box plot vs arrival.\n\nThe central rectangular \"box\" represents the interquartile range (IQR), which spans the middle 50% of the data. The bottom edge of the box is the first quartile (Q1), and the top edge is the third quartile (Q3). The height of the box represents the spread of the middle 50% of the data.\n\nThe whiskers represent the range of the data outside of the IQR, and can be seen as the wider distribution of outcomes in the dataset.\n\nThe white line represents the median of the dataset.\n\nWhy do we use them?\n\nThey paint a good picture when looking at arrival performance over a particular time frame, bucket or specific algo. We are able to quickly observe if ranges have tightened or widened.", "template": false, "chart": true, "lastSent": ""}, {"id": "TCA-025", "theme": "TCA", "title": "Child Amendments", "topic": "Methodology & Statistics", "text": "When you look at TCA do you take into account amendments throughout the parent order lifetime?\n\nBerenberg's TIA is able to treat each amend as a new order and weight results between each amend. This gives a more accurate representation of results when an order is traded across multiple strategies throughout the day.\n\nReach out to your coverage for more details.", "template": false, "chart": false, "lastSent": "2026-01-13"}, {"id": "TCA-026", "theme": "TCA", "title": "Market-Adjusted Arrival Mid", "topic": "Methodology & Statistics", "text": "When measuring trading costs do you look at adjusted arrival mid? By taking in the underlying index move (sector or market).", "template": false, "chart": false, "lastSent": "2024-02-13"}, {"id": "TCA-027", "theme": "TCA", "title": "Performance by ADV Bucket", "topic": "Methodology & Statistics", "text": "Do you bucket performance by ADV?\n\nWhen looking at strategy specific performance it helps to look at performance in context of ADV. In general larger ADV orders will have more of an impact. By looking at performance for each bucket trading strategies can be better refined.\n\nBerenberg's TIA can bucket performance by ADV bucket and compare performance across multiple benchmarks to give you an insight into how your performance varies across different volume profiles.", "template": false, "chart": false, "lastSent": "2024-03-19"}, {"id": "TCA-028", "theme": "TCA", "title": "Time of Day Effects", "topic": "Methodology & Statistics", "text": "TIME OF DAY\n\nDo you factor in the time of day when assessing algo or broker performance?\n\nTrading outcomes often vary significantly depending on when during the day the orders are executed, influenced by differing liquidity conditions.\n\nFor instance, orders placed around the market open typically face tougher trading conditions \u2014 characterized by wider spreads, lower liquidity, and higher volatility \u2014 compared to those executed closer to the close.\n\nTIA can break down performance by hour, providing insights through time-bucketed results. See below for a screenshot of arrival performance segmented by time.", "template": false, "chart": true, "lastSent": ""}, {"id": "TCA-029", "theme": "TCA", "title": "A/B Testing", "topic": "Methodology & Statistics", "text": "A/B testing can be summarised as choosing the specific metrics to be evaluated by testing/measuring the output of different inputs. This needs to be done on a large dataset to analyse the results and draw a meaningful and valid conclusion.\n\nThis can be very useful for optimising algo performance.\n\nNew trading tactics have been built on the back of this. Examples include introducing a new dark priority mode on lit strategies to reduce signalling on the book as well as new lit passive modes that take into account volumes posted on each venue (vs looking at the consolidated vol) and subsequently does not create a new market pricing on at individual venue level and leverages the full dark venue universe simultaneously to capture mid-point liquidity.\n\nOur strategies are constantly evolving as the data set grows and we continue to apply our micro-market structure to algo logic.\n\nSpeak with your coverage to understand more about our algo enhancements and current product pipeline.", "template": false, "chart": false, "lastSent": ""}, {"id": "TCA-030", "theme": "TCA", "title": "ADV and MDV", "topic": "Order Characteristics", "text": "Why is Median Daily Volume (MDV) often used instead of ADV? ADV will take an average of the volume traded for each day across a historic range typically between 20-30d. This means special days (expiries, month end, rebalances etc) are included in the calculation which can often skew the value. MDV uses the median of the range which helps omit any special days.", "template": false, "chart": false, "lastSent": "2024-10-15"}, {"id": "TCA-031", "theme": "TCA", "title": "Duration: Cost vs Risk", "topic": "Order Characteristics", "text": "Why should you look at duration when reviewing your TCA?\nFor IS based strategies that aim to reduce trading costs it helps when comparing strategies and trading decisions by looking at the order lifetime duration.\nShorter duration orders are usually paired with lower spread capture and higher pov rates. While reducing duration should tighten your standard deviation in performance (getting done quickly around arrival) it does remove opportunity cost.\nFor some types of flow shorter durations work well i.e smaller orders in tighter spreads in liquid stocks where the timing risk of stretching out the order massively outweighs the opportunity risk..\nWhen there is no inherent alpha in a order and its likely that trading quickly will cause impact, duration of trades tend to be longer.\nBy comparing different strategies duration you can get a quick idea of how passive / aggressive a strategy is.", "template": false, "chart": false, "lastSent": "2024-10-08"}, {"id": "TCA-032", "theme": "TCA", "title": "Intrade Volatility", "topic": "Order Characteristics", "text": "What is intrade volatility and how is it calculated? Intrade volatility is the standard deviation of the price of market trades from the interval vwap during the order lifetime. For context, if all volume over the time period is done at the same price, volatility is zero. As volume becomes spread across prices, the volatility increases, making it increasingly difficult to track VWAP. Intraday volatility can therefore be used as a difficulty factor when assessing performance versus VWAP. Berenberg's TIA can calculate and group your orders by intrade volatility, reach out to your coverage for more details.", "template": false, "chart": false, "lastSent": "2024-06-25"}, {"id": "TCA-033", "theme": "TCA", "title": "Pre-Trade Cost Model", "topic": "Pre-trade models", "text": "What is a pre trade cost model?\n\nPre-trade analysis tools enrich the traders\u2019 routing and timing decisions by providing an estimated implementation cost ahead of an order execution.\n\nPredicted market impact models rely on historical or intraday pre-trade trade data such as ADV, historical spread, volatility, volume delta and market cap along with other features relevant to the stock and expected trading conditions to calculate a trades implicit cost.\n\nOnce a trade is completed, traders will often perform a post-trade Transaction Cost Analysis (TCA), to compare their trade performance against the predicted impact to assess the quality of performance of an algo or of a trader.", "template": false, "chart": false, "lastSent": null}, {"id": "TCA-034", "theme": "TCA", "title": "Arrival Mid: Not the Whole Story", "topic": "Pre-trade models", "text": "When measuring execution, arrival mid is often the only benchmark used to judge performance.\nAdd context to your arrival performance by also considering:\n- Pre-trade cost estimate \u2014 were results in line with expectations?\n- PWP \u2014 was alpha left on the table by finishing too quickly?\n- Market-adjusted arrival \u2014 how much of the slippage was driven by market moves?\n- Volatility context \u2014 was performance helped or hurt by the trading environment?\nBerenberg's TIA can showcase your arrival performance with added context - reach out to your coverage for more details.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-001", "theme": "ALGO", "title": "Entering TAL via SOR", "topic": "Close, Open & TAL", "text": "To enter an order in TAL, send an order via SOR with the close price as the limit price \u2013 please also reach out to your coverage if you have any further questions on this.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-002", "theme": "ALGO", "title": "Scaling Close via IAP", "topic": "Close, Open & TAL", "text": "Want to take advantage of large dislocations between the closing price and the last continuous price? Berenberg offers a scaling close algorithm which will scale participation based on Indication Auction Price (IAP). Increasing/decreasing participation as the IAP becomes favorable/unfavorable.\n\nReach out to your coverage for more details.", "template": false, "chart": false, "lastSent": "2024-06-26"}, {"id": "ALGO-003", "theme": "ALGO", "title": "Tclose", "topic": "Close, Open & TAL", "text": "Want to be opportunistic at favourable levels in the auction vs a pre close benchmark? BEAT offers a scaling close algo which will participate in the auction at a level between two hi-lo participation bands depending on how favourable the level is.", "template": false, "chart": false, "lastSent": "2024-02-21"}, {"id": "ALGO-004", "theme": "ALGO", "title": "Trading On The Open", "topic": "Close, Open & TAL", "text": "Trading an order that is targeting the open price? BEAT offers a target open strategy which can limit all trading or just dark fills to prices better than the opening price.", "template": false, "chart": false, "lastSent": "2024-06-12"}, {"id": "ALGO-005", "theme": "ALGO", "title": "Target Open Orders", "topic": "Close, Open & TAL", "text": "Trading an order that is targeting the open price?\n\nBEAT's TARGET OPEN strategy can limit all trading after the open to the open price.\nAlternatively a dark would can be placed at the open price dynamically alongside your trading in continuous.\n\nN.B. Target open orders sent after the open will be rejected.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-006", "theme": "ALGO", "title": "OPEN Algo Part Rates", "topic": "Close, Open & TAL", "text": "Want to target the opening auction?\n\nBEATs OPEN algo allows you to specify a part rate for the opening auction as well as a part rate for any residual in continuous.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-007", "theme": "ALGO", "title": "US Pre-Market", "topic": "Pre Mkt", "text": "Want to access the US market ahead of the open?\nUse \"SOR\" to interact with pre market by entering \"pre\" in custom 1.\nN.B. Requires a limit price.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-008", "theme": "ALGO", "title": "Looking to Seek Liquidity in ETFs?", "topic": "ETFs & Other Access", "text": "Looking to seek liquidity in ETFs?\n\nUnlike the Equity market, nearly 75% of ETF liquidity is traded off-exchange bilaterally, with the likes of Jane St, Optiver and Flow via RFQ mechanisms.\n\nBEAT has access to over 20 ETF Liquidity Providers. Our avg execution is inside the far touch 90% of the time, performing 3.0bps better than the far touch on an average order size 5x the ADV.\n\nGet in touch with your BEAT coverage to see how you can access.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-009", "theme": "ALGO", "title": "Early-Session Spreads Tip", "topic": "General Tips", "text": "Spreads are typically the widest and touch sizes the smallest at the beginning of the trading day. If your orders are not sensitive to timing risk, you can skip the first few minutes of trading by entering a start time.\nBerenberg's algos offer a start time across all of our strategies.\nFor example you may want to opt out of the first 15 minutes of trading - this can be achieved by using a start time of 08:15.\nReach out to your coverage for more details.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-010", "theme": "ALGO", "title": "The I would Dark Strategy at a Benchmark", "topic": "I would", "text": "Want to default a strategy to include a 'I Would Dark' px at a particular benchmark?\n\nBEAT can default a I Would Dark px that allows you to allocate a % of your balance to dark venus at a specified price using the following benchmarks:\n\n>Arrival Near/Mid/Far\n>iVWAP\n>PreviousClose\n>Open\n>Last Continuous\n>Market Arrival.", "template": false, "chart": false, "lastSent": null}, {"id": "ALGO-011", "theme": "ALGO", "title": "Rescuing a Struggling VWAP", "topic": "I would", "text": "Trading a VWAP order that may struggle to complete? Leverage the iWOULD Dark Px and % to get some done at opportune levels to reduce the chance of leaving a balance.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-012", "theme": "ALGO", "title": "Custom: Dark Priority Trading", "topic": "IS& Benchmark strategies", "text": "Common Customs: Dark priority trading, placing emphasis on using dark posting to track lit vol. Going lit as and when needed. Trade off is reduce spread capture to limit on screen signalling.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-013", "theme": "ALGO", "title": "Flag Orders to High Touch", "topic": "IS& Benchmark strategies", "text": "If you are working an order in an algo and want to flag it to the high touch desk. Select \"Yes\" in the Block field on your algo ticket.\nBy default this is left blank, we also offer options to only opt in to low touch crossing opportunities.\nReach out to your coverage for more details.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-014", "theme": "ALGO", "title": "IS: Scale Speed with Price", "topic": "IS& Benchmark strategies", "text": "Want to work with volume but slow down when the price is less favourable vs arrival?\n\nUse Berenberg's IS strategy which will scale participation based on price vs arrival.\n\nWe also offer an IS strategy which will work in the opposite manner by slowing down when the price is favourable and speeding up when it moves away from arrival.\n\nReach out to y
