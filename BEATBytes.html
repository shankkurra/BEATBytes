our coverage if you want to be enabled for this.", "template": false, "chart": false, "lastSent": "2026-01-21"}, {"id": "ALGO-015", "theme": "ALGO", "title": "Relative Limits", "topic": "IS& Benchmark strategies", "text": "Do you want your order to continue participating but don't have time to adjust your limit throughout the day to protect yourself from adverse price spikes?\n\nLeverage BEAT Relative Limits - they dynamically amend throughout the order interval. Simply enter a limit price on the order relative to: Arrival, Market Index or iVWAP.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-016", "theme": "ALGO", "title": "I would Into the Close", "topic": "Level and Price-Linked", "text": "Is there a level at which you would complete in the closing auction?\nBerenberg's I Would tactic rolls into the closing auction, allowing you to track your desired participation rate and take advantage of any price swings in the uncrossing.\nThis is available across all algos that offer the I Would functionality.\nReach out to your coverage for more details.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-017", "theme": "ALGO", "title": "VWAP Baskets: Use Max Alpha", "topic": "Level and Price-Linked", "text": "Trading VWAP on a basket level and want to improve average performance?\n\nUse Max alpha to increase the VWAP tracking bands from +3% ahead and -4% behind to +4% head and -5% behind to give the strategy more discretion to capture the spread.\n\nMax Alpha will likely improve Avg Performance vs iVWAP by up to 50% while also increasing standard deviation by not tracking the curve as Strict as Neutral.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-018", "theme": "ALGO", "title": "Price-Linked Participation", "topic": "Level and Price-Linked", "text": "Looking to adjust participation depending on price to take advantage of price swings?\n\nBEATS Level Strategy allows you to create custom participation bands depending on the movement of stock price, changing in discrete steps as the mid price varies against your participation profile - up to 4 levels available to you.\n\nWe can default your price levels to basis point offsets from arrival and we also offer a dark only version of this strategy\n\nReach out to your coverage for more details.", "template": false, "chart": false, "lastSent": null}, {"id": "ALGO-019", "theme": "ALGO", "title": "Marksman: Joining Auctions", "topic": "Marksman", "text": "If you are using our Marksman Strategy, you won't participate in the open or closing auction by default. Enter a display size on your Marksman orders to ensure you don't miss out on auctions!", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-020", "theme": "ALGO", "title": "Marksman: Sniper vs Iceberg", "topic": "Marksman", "text": "Our Marksman Strategy has 2 modes of operation\n\nSniper: The default mode - Takes liquidity without showing size on the book\nIceberg: Enter a display size to convert your order to an Iceberg at your limit - reloads when complete\n\nYou can select a minimum take size in shares or a multiple of the average quote size. If both of these are set, the largest size will be the effective minimum take.\n\nThis strategy can also be used when trading an illiquid stock to cross spread for outsized liquidity. Pick a limit price and use MARKSMAN with a \"Min Take\" and you will only cross the spread to trade with volume larger than the qty specified.\n\nReach out to your coverage for more details.", "template": false, "chart": false, "lastSent": "2024-10-16"}, {"id": "ALGO-021", "theme": "ALGO", "title": "Optimus for Small Caps", "topic": "Optimus", "text": "Use OPTIMUS, our algo specifically designed to trade small caps and more illiquid securities. It scans the darks to capture liquidity at arrival and trades in the lit using a scorecard model that influences its posting size and frequency.\nWe offer 5 different urgencies ranging from VERY LOW to VERY HIGH. As the urgencies increase, lit participation increases, the venues accessed broadens, and the MAQs on alternative venues become smaller.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-022", "theme": "ALGO", "title": "Built for Small Caps & Wide Spreads", "topic": "Optimus", "text": "Designed to navigate trading small caps with wider spreads, scorecard led strategy combining intelligent lit posting built to minimize impact, narrowing spreads (leveraging\u00a0dark placement logic) and snipes outsized liquidity.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-023", "theme": "ALGO", "title": "Field Defaults", "topic": "Defaults", "text": "Continuously entering in algo fields when sending orders?\n\nWe can default any field by trader, market, market cap and more. BEAT are flexible and quick to market, with the ability to amend strategy parameter defaults intra-day.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-024", "theme": "ALGO", "title": "MAQs", "topic": "Defaults", "text": "MAQ or Minimum Acceptable Quantity - are applied on the child order level and limits overall executions below the specified acceptable quantity. Venues in Europe will aggregate fills up to your minimum fill size meaning individual fills will come back onto your ticket with the same timestamp that collectively make up your min size requirement.\n\nMES or Minimum Execution Size on the other hand will limit the actual fill received by the venue.\n\nThe venue itself dictates whether MAQ or MES is supported.\n\nBerenberg's dark SOR by default will apply an MES/MAQ based on a factor of average trade size, depending on urgency this will be smaller or larger and dynamically scale with price.\n\nWe also allow users to specify their own minimum dark fills on the Algo ticket.", "template": false, "chart": false, "lastSent": "2024-10-30"}, {"id": "ALGO-025", "theme": "ALGO", "title": "Set Your Own Defaults", "topic": "Defaults", "text": "Are you fed up with constantly having to add parameters manually?\nAt Berenberg, we can set default values for any algo parameter on your tickets.\nFor example - if you\u2019d like your POVs to default to 5% and the execution style set to Strict, we can configure this for you! Meaning that when you send a blank ticket, these parameters will be applied automatically.\nReach out to your coverage for more details.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-026", "theme": "ALGO", "title": "POV Tips", "topic": "Defaults", "text": "POV TIPS\n> By default, our POV algo participates in all auctions (inc. volatility and expiries) trades at a 15% part rate.\n\n> Slice a portion of your order at a level in the dark/lit by making use of the IWould % field\n\n> Target a particular benchmark in the dark such as Arrival Mid, Previous Close or Open\n\nReach out to your coverage for more details.", "template": false, "chart": false, "lastSent": "2026-01-07"}, {"id": "ALGO-027", "theme": "ALGO", "title": "25% Vol Max Default Reminder", "topic": "Defaults", "text": "REMINDER... VWAP and TWAP include by default 25% volume max in order to protect orders from extreme market impact. Therefore, if you are trading an order that is close to 25% of the RDV, you may encounter liquidity issues and may not complete.\n\nFind a reminder of all BEAT EU strategy defaults below. Any fields shown can be amended. Get in touch with your BEAT coverage for more information.", "template": false, "chart": false, "lastSent": "2024-10-10"}, {"id": "ALGO-028", "theme": "ALGO", "title": "Default Auction Participation", "topic": "Defaults", "text": "By default all Berenberg's algos will be placed in both the open and closing auctions as well as intraday, volatility, or expiry auctions.\n\nOur volume defaults are as follows:\n\nPOV/IS/OPEN/ULTRA/OPTIMUS - 15%\nVWAP/TWAP - 25%\nCLOSE - 30%\n\nReach out to your coverage for more details.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-029", "theme": "ALGO", "title": "Crosses, Blocks", "topic": "Parameters", "text": "Open to crossing natural liquidity? Use BEAT parameters to let your coverage know you're open to crosses and blocks.\n\n\u2022 BEAT Cross = Cross with contra side liquidity\n\n\u2022 Block = Open to a natural cross\n\n\u2022 Benchmark = Open to crossing at a benchmark.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-030", "theme": "ALGO", "title": "Only Auctions Parameter", "topic": "Parameters", "text": "Only Auctions = ALL will aim to interact with intra-day and volatility auctions. If Open, Close or None is set then the BEAT strategy will not participate in the intra-day and volatility auction.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-031", "theme": "ALGO", "title": "Start Time", "topic": "Parameters", "text": "Want to skip the auction at the first 15 minutes of trading to avoid increased cost of trading? Use a start time of 08:15 on your algo orders.", "template": false, "chart": false, "lastSent": "2024-08-07"}, {"id": "ALGO-032", "theme": "ALGO", "title": "Urgencies: Tracking Tightness", "topic": "Parameters", "text": "Urgencies: Max Alpha / Neutral / Strict \u2013 Determine how tight you track your target rate.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-033", "theme": "ALGO", "title": "PEG Offset Parameter", "topic": "PEG & PASSIVE", "text": "Looking to trade at a price defined by an offset from the near touch? BEATs PEG strategy will send a display size to the market at a price relative to the best bid-offer with a Smart Randomised Display Size functionality. Leverage the PEG OFFSET parameter to determine the number of ticks from the near touch price you would like to place the child order.\nLeverage the IWouldDark Px and % in order to sweep Dark and Periodic Auctions at midpoint, by default it will remain Lit only.\n\nIf there is a certain size you are willing to cross the spread for you can specify this in \"MinTake\" by default this is set to 0.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-034", "theme": "ALGO", "title": "Udark Tips", "topic": "Ultra & Ultra Dark", "text": "Our award winning ULTRADARK strategy has 5 urgencies which span from VERY LOW to VERY HIGH.\nBy default orders will be in NEUTRAL urgency.\nAs the urgency increases the MAQ used will decrease and venue mix is widened to include more sources of liquidity.\nLooking for outsized liquidity only? Use VERY LOW\nWant to capture everything and not concerned about impact? Use VERY HIGH.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-035", "theme": "ALGO", "title": "Guarding Against Adverse Selection", "topic": "Ultra & Ultra Dark", "text": "Want to seek liquidity but worried about getting run over by a larger counterparty? Protect yourself against adverse selection by using I Would Dark % in Ultra and Optimus.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-036", "theme": "ALGO", "title": "I would Dark % Defaults", "topic": "Ultra & Ultra Dark", "text": "Ultra and Optimus liquidity seekers are defaulted to 100% I Would in Dark. Use the \"I Would Dark %\" parameter to adjust this in order to protect yourself from getting run over by a larger counterparty and getting adversely selected (Stock trading in your direction post order completion).", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-037", "theme": "ALGO", "title": "Ultra Auction Urgency Table", "topic": "Ultra & Ultra Dark", "text": "For Ultra orders going into the open or going into/entered during the closing Auction - Ultra will use your order urgency to target a rate of the indicative opening or closing auction volume:\n\nUrgency - Very Low: [5% \u2013 update]\nUrgency - Low: [10% \u2013 update]\nUrgency - Neutral: [15% \u2013 update]\nUrgency - High: [20% \u2013 update]\nUrgency - Very High: [25% \u2013 update]\n\nIn the event you do not specify an urgency on your orders you will default to Neutral\n\nVOL MAX% - can be used to override your default auction target%. If entered in continuous - this will also be used as your continuous Vol Max%.", "template": true, "chart": false, "lastSent": ""}, {"id": "ALGO-038", "theme": "ALGO", "title": "Ultra", "topic": "Ultra & Ultra Dark", "text": "When markets seem a little fragile and volatility is spiking, liquidity tends to migrate to lit trading venues over Dark & P. Auctions.\n\nBEAT suggests using Ultra over UltraDARK in high urgency during these situations to participate with lit volume and ensure you track volume whilst dynamically sourcing dark liquidity at opportunistic price levels, leveraging static or relative dark limits (e.g. iVWAP and Arrival Mid).\n\nPlease reach out to your coverage to discuss in more detail.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-039", "theme": "ALGO", "title": "Ultra Dark: LIS Cap, No Floor", "topic": "Ultra & Ultra Dark", "text": "If you are using Ultra Dark and want to limit the size of your dark fills to a factor of LIS, without working out the share amounts yourself then we have an easy solution for you:\n\nUse \"Min Dark Fill Type\" and select LIS, the value you place in \"Min Fill\" will dictate the factor of LIS.\n\nFor example - a value of 1.5, would apply a 1.5x LIS min dark fill on your order.\n\nLast's month LIS market share was 1.9% of on venue turnover and normally have one of the best mark-out performance vs other venue types. Increasing interaction with LIS venues can improve parent order performance.\n\nIf you don't have the time to specify units/shares, you can use BEAT's Urgency field:\n\nA higher urgency (HIGH) decreases your minimum fill size and gives you exposure to more venues, a lower urgency (LOW) increases your minimum fill size and prioritizes block venues as you scale down to (VERY LOW).", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-040", "theme": "ALGO", "title": "Ultra Dark: Non-Displayed Seeking", "topic": "Ultra & Ultra Dark", "text": "Leverage ULTRA DARK when seeking liquidity across non-displayed markets, simultaneously reducing information leakage and price impact.\nYou can specify a minimum dark fill size and set your urgency to increase/decrease venue interaction.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-041", "theme": "ALGO", "title": "Ultra, Ultra Dark", "topic": "Ultra & Ultra Dark", "text": "Leverage ULTRA/ULTRA DARK - VERY LOW urgency to interact with LIS liquidity through staggered releases of LiS conditional orders in block centric venues and simultaneous placement of LiS firm orders where matching logic is prioritised over conditional.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-042", "theme": "ALGO", "title": "Ultra: Dark-Then-Lit Sweep", "topic": "Ultra & Ultra Dark", "text": "Leverage ULTRA to capture liquidity across both hidden and displayed venues. Ultra will attempt to complete the order in the darks at midpoint and then continuously source dark liquidity whilst working lit markets.\n\nNOTE: Ultra defaults to 100% iWOULD Dark %, amend the iWOULD Dark % to alter this, protecting the order from being run over by larger counterparties.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-043", "theme": "ALGO", "title": "Very High Ultra", "topic": "Ultra & Ultra Dark", "text": "If you want to access all liquidity with no minimum fill sizes in the dark use ULTRA VERY HIGH which removes MAQs from dark trading. Lit volume will be tracked at 25% and all accessible venues included.\n\nN.B Very high urgency will require a limit.", "template": false, "chart": false, "lastSent": "2024-09-25"}, {"id": "ALGO-044", "theme": "ALGO", "title": "Ultra Dark: Very High Urgency", "topic": "Ultra & Ultra Dark", "text": "Want to be more aggressive in our dark only strategy?\n\nAmend your urgency to \"Very High\" using ULTRA DARK. This will remove minimum execution size and expose you to all dark venue types.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-045", "theme": "ALGO", "title": "Ultra Very High: No Dark MAQs", "topic": "Ultra & Ultra Dark", "text": "Need to access all liquidity with no minimum fill sizes in the dark?\n\nUse ULTRA VERY HIGH which removes MAQs from dark trading, and will interact with all available liquidity across Europe's dark books. Lit volume will be tracked at 25% and ELP quotes will be interacted with in full.\n\nN.B. Requires a limit.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-046", "theme": "ALGO", "title": "Ultra Urgency Scaling", "topic": "Urgencies and Execution styles", "text": "Ultra our flagship dark/lit liquidity seeker will scale participation in the lit depending on multiple real time factors between a minimum and a maximum part rate which can either be determined by urgency or a client input. Amending Ultra with urgency VERY HIGH, would reduce your MEQs in the darks, increase your lit participation and is more likely to cross the spread.\n\nAlternatively use MARKSMAN which will snipe to your limit, aggressively sweeping liquidity across all venues without posting. (note: requires a limit!)\n\nThe default max part rates for each urgency are:\n\nVLOW 5%\nLOW 10%\nNEUTRAL 15%\nHIGH 20%\nVERY HIGH 25% \n\nN.B. V HIGH requires a limit.", "template": false, "chart": false, "lastSent": "2024-06-19"}, {"id": "ALGO-047", "theme": "ALGO", "title": "IS: Scale vs Benchmark", "topic": "Urgencies and Execution styles", "text": "Want to scale your participation vs a particular benchmark?\n\nOur IS algo allows you to choose from a variety of benchmarks including Previous Close, Open, iVWAP as well as Sector & Market indices.\n\nThe default benchmark price for IS is the Arrival Mid price and scales the participation based on whether the current market price is favourable or unfavourable.\n\nParticipation bands are as follows\n- Max Alpha: 5-10%\n- Neutral: 7-15%\n- Strict: 9-20%.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-048", "theme": "ALGO", "title": "VWAP Tracking Objectives", "topic": "Urgencies and Execution styles", "text": "Choose a tracking objective on your VWAPs using various execution styles when navigating a low liquidity landscape or trading in a market trending in your direction:\n\nMax Alpha \u2013 Prioritise lower impact costs using increased/wider deviation from your tracking rate in order to capture more of the spread. Discretionary band: Upper= +2%, Lower=-3%. Avg Spread Capture=79%\n\nNeutral \u2013 Discretionary band: Upper= +3%, Lower= -4%. Avg Spread Capture= 75%\n\nStrict \u2013 Track a stocks volume distribution more closely if they are liquidity sensitive. Discretionary band: Upper=+4%, Lower=-5%. Avg Spread Capture= <65%\n\nPlease reach out to your coverage if you have any additional questions on this.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-049", "theme": "ALGO", "title": "Urgencies: Part-Rate Headroom", "topic": "Urgencies and Execution styles", "text": "Urgencies: Max Alpha 20% / Neutral 30% / Strict 40% - A 10% headroom is applied to each of these urgencies should there be a variance from our predicted closing volumes.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-050", "theme": "ALGO", "title": "Urgencies: Venue & MAQ Control", "topic": "Urgencies and Execution styles", "text": "Urgencies: VLOW / LOW / NEUTRAL / HIGH / VHIGH \u2013 Controls venue type and MAQ (more aggressive the urgency = larger venue mix and lower MAQ).", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-051", "theme": "ALGO", "title": "Relative Dark Prices on Schedules", "topic": "VWAP & Schedules", "text": "Are you trading over a schedule (either VWAP or TWAP) but happy to get done in the Dark when the stock price is better than a particular benchmark?\n\nLeverage BEAT Relative Dark Prices:\n- IVWAP\n- Arrival Index Relative\n- Arrival\n- Previous Close\n\nSpeak to your BEAT coverage on how to set up the customisation for your style of trading.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-052", "theme": "ALGO", "title": "Specific Share Quantity VWAP", "topic": "VWAP & Schedules", "text": "NEW! Do you want to specify the share quantity allocated to the closing auction in your VWAP strategy? BEAT now offers this functionality via the use of custom tags. Reach out to your coverage for more details.", "template": false, "chart": false, "lastSent": "2024-04-03"}, {"id": "ALGO-053", "theme": "ALGO", "title": "TWAP in Volatile Markets", "topic": "VWAP & Schedules", "text": "During volatile markets if you have no view on market direction a TWAP profile may be your best algo choice.\n\nExecution style on TWAP can increase / decrease the frequency duration of fills and therefore result in a different spread capture and overall performance of the order.\n\nMax Alpha slice frequency is 180s\nNeutral slice frequency is 90s\nStrict slice frequency is 45s\n\nThe higher the time between child slices, the more discretion the algo has to capture more of the spread.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-054", "theme": "ALGO", "title": "VWAP Tilt Options", "topic": "VWAP & Schedules", "text": "Want to take a view on a stock's volume profile whilst trading VWAP?\n\nBEAT's \"Tilt\" option gives you the choice to tilt your VWAP order.\n\nSelect one of the following:\n\n>Back Tilt\n>Minor Back Tilt\n>Minor Front Tilt\n>Front Tilt\n\nSelecting back tilt will weight and redistribute the volume profile from the front to the back of the curve/trading duration.", "template": false, "chart": false, "lastSent": "2024-04-24"}, {"id": "ALGO-055", "theme": "ALGO", "title": "VWAP/TWAP", "topic": "VWAP & Schedules", "text": "Trading a VWAP order late in the day?\n\nThe curve will likely be back weighted to the closing auction volume. Reduce the skew by front tilting the curve or amend to TWAP.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-056", "theme": "ALGO", "title": "What Matters on Schedules", "topic": "VWAP & Schedules", "text": "Trading over a schedule: What matters.\n\n-- Volume prediction --\nEOD Volume for participation rate calculation. A 6% change in the EOD volume calculation relates to \u00b12.6bps difference in VWAP performance.\n\n-- Benchmark tracking --\n+3% and -4% are optimal deviation rates from the benchmark. Adjust for trading early or late in interval, Style, Order book dynamics, Stock spread, and Volatility\n\n-- SOR differentiation--\nNo Cost biases within the SOR.\n6x lower min submission size (vs. our competitors) allows for tighter tracking of the volume.\nNo conflict of interest \u2013 internalisation and VWAP benchmark crossing.\n\nBEAT VWAP performance is around -8-10% of the spread with a 75% spread capture.\n\nReach out to your coverage for more details.", "template": false, "chart": false, "lastSent": ""}, {"id": "ALGO-057", "theme": "ALGO", "title": "SOR Posting Underfills", "topic": "SOR", "text": "SORs posting tend to have reduced fill rates as a result of sub-optimal logic to trade on cheaper / higher rebate venues (venues with the longest queues).\n\nBEAT's cost agnostic SOR leverages relative queue length, which increases the probability of a passive fill.\n\nPlease reach out to your coverage to discuss in more detail.", "template": false, "chart": false, "lastSent": ""}, {"id": "BOT-001", "theme": "BEATBOT", "title": "TCLOSE Early Starts", "topic": "Auction & Close Alerts", "text": "Do you have multiple orders targeting the closing auction and need to know which ones are likely to start early?\nBEATBOT can help. We offer alerts associated with your live algo orders, delivered directly to your Bloomberg alert catcher.\nAlerts for the TCLOSE algo include:\nExpected residual size\nContinuous start time\nNotification when continuous phase is 5 minutes from starting\nReach out to your c /* ---------- shared team log ---------- */
const LOGKEY='beatbytes-sendlog-v2';
let liveLog=[],logMode='none'; // 'shared' (Claude storage) | 'local' (this machine) | 'none'
async function loadLog(){
  try{const r=await window.storage.get(LOGKEY,true);liveLog=JSON.parse(r.value);logMode='shared';return}
  catch(e){try{await window.storage.set(LOGKEY,'[]',true);liveLog=[];logMode='shared';return}catch(e2){}}
  try{const v=localStorage.getItem(LOGKEY);liveLog=v?JSON.parse(v):[];logMode='local';return}catch(e){}
  liveLog=[];logMode='none';
}
async function saveLog(){
  if(logMode==='shared'){try{await window.storage.set(LOGKEY,JSON.stringify(liveLog),true);return}catch(e){logMode='local'}}
  try{localStorage.setItem(LOGKEY,JSON.stringify(liveLog));logMode=logMode==='shared'?'shared':'local'}catch(e){logMode='none'}
}
const storageOkMsg=()=>logMode==='shared'?'Copied \u2014 send logged for the team':(logMode==='local'?'Copied \u2014 send logged on this machine (not shared)':'Copied. Send log unavailable here');
const allSends=()=>[...DATA.backfill.map(([d,id])=>({date:d,id})),...liveLog];
/* ---------- rotation ---------- */
function lastSentMap(){const m={};allSends().forEach(s=>{if(!m[s.id]||s.date>m[s.id])m[s.id]=s.date});return m;}
function rotation(th){
  const ls=lastSentMap();
  const base=DATA.queues[th]||[];
  const never=base.filter(id=>!ls[id]);
  const dated=base.filter(id=>ls[id]).sort((a,b)=>ls[a].localeCompare(ls[b]));
  return never.concat(dated);
}

      <span style="display:flex;gap:8px;align-items:center">${note}${sent?'<span class="pill sent">Sent today ✓</span>':''}<span class="idc">${b.id}</span></span>

    <div class="msgtext">${esc(resolveTokens(b.text))}</div>
    ${b.template?'<div class="flagline">Figures appear as [brackets] / x placeholders — these populate automatically once Qlik is linked; until then fill them in before sending.</div>':''}

}
window.copySend=async id=>{
  const b=byId[id];if(!b)return;
  await copyText(msgFor(b));
  const t=fmtDate(new Date());
  if(!liveLog.find(s=>s.date===t&&s.id===id)){liveLog.push({date:t,id});await saveLog();}
  toast(storageOkMsg());
  render();
};
window.copyOnly=async id=>{const b=byId[id];if(!b)return;await copyText(msgFor(b));toast('Copied to clipboard');};
window.undoSend=async id=>{
  const t=fmtDate(new Date());const n=liveLog.length;
  liveLog=liveLog.filter(s=>!(s.date===t&&s.id===id));

  if(weekPreview)weekPreview=null;
  const now=new Date(),th=todayTheme(now),t=fmtDate(now);
  const nice=now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  let hero;
  if(th==='QUIZ'){hero=quizHero();}
  else{
    const sends=allSends().filter(s=>s.date===t);
    const sentB=sends.map(s=>byId[s.id]).find(b=>b&&b.theme===th);
    const b=sentB||pickFor(th);
    hero=b?byteCard(b,{sent:sends.some(s=>s.id===b.id)}):'<div class="card prose">No bytes available for today.</div>';
  }
  el('content').innerHTML=`
    <div class="eyebrow">Today · ${DAYNAME[th]}</div>
    <h1 style="margin:6px 0 20px">${nice}</h1>
    ${hero}
    <div class="wk">
      <div class="eyebrow" style="margin-bottom:10px">This week</div>
      <div class="card">${weekRows(now)}</div>
    </div>`;
}
function weekRows(now){
  const mon=weekMonday(now),t=fmtDate(now);
  const sends=allSends();
  const order=['MKT','TCA','ALGO','BEATBOT','QUIZ'];
  return order.map((th,i)=>{
    const d=new Date(mon);d.setDate(mon.getDate()+i);
    const ds=fmtDate(d);
    const isToday=ds===t,isPast=ds<t;
    const daySends=sends.filter(s=>s.date===ds);
    const rec=daySends.map(s=>({s,b:byId[s.id]})).find(x=>(x.b&&x.b.theme===th)||(th==='QUIZ'&&String(x.s.id).startsWith('QUIZ')))
      ||(daySends.length&&!daySends.some(s=>byId[s.id])?{s:daySends[0],b:null}:null);
    let main,act='',prevId=null;
    if(rec){
      if(rec.b){prevId=rec.b.id;main=`<b>${esc(rec.b.title)}</b><span><span class="idc">${rec.b.id}</span> · ${esc(rec.b.text.slice(0,110))}…</span>`;}
      else if(th==='QUIZ'&&String(rec.s.id).startsWith('QUIZ')){main=`<b>Generated quiz</b><span>Fresh question written on the day</span>`;}
      else{main=`<b>Sent ✓</b><span>Logged under an earlier data version (<span class="idc">${esc(rec.s.id)}</span>)</span>`;}
      act=`<span class="pill sent">Sent ✓</span>`;
    } else if(th==='QUIZ'){
      main=isPast?`<b style="color:var(--muted)">Nothing logged</b><span>Friday's quiz is generated on the day.</span>`
        :`<b>Quiz Friday</b><span>Three fresh options generated from the week's news</span>`;
      act=isPast?'<span class="pill miss">Not logged</span>':(isToday?'<span class="pill up">Today</span>':'<span class="pill up">Queued</span>');
    } else {
      const b=isToday?pickFor(th):byId[rotation(th)[0]];
      prevId=b?b.id:null;
      if(isPast){main=`<b style="color:var(--muted)">Not logged — ${b?esc(b.title):'—'}</b><span>${b?`<span class="idc">${b.id}</span> · was queued for this day`:''}</span>`;act='<span class="pill miss">Not logged</span>';}
      else{main=`<b>${b?esc(b.title):'—'}</b><span>${b?`<span class="idc">${b.id}</span> · next in the ${DAYNAME[th].split(' ')[0]} rotation`:''}</span>`;act=isToday?'<span class="pill up">Today</span>':'<span class="pill up">Queued</span>';}
    }
    const canPrev=prevId&&!isToday;
    return `<div class="wkrow ${isToday?'today-row':''}">
      <div class="wkday"><b>${d.toLocaleDateString('en-GB',{weekday:'long'})}</b><span>${d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span></div>
      <span class="thcol"><span class="pill ${th}">${DAYNAME[th].split(' ').slice(0,-1).join(' ')||'Quiz'}</span></span>
      <div class="wkmain">${main}</div>
      <div class="wkact">${act}${canPrev?`<button class="btn ghost" onclick="openPreview('${ds}','${th}','${prevId}',${!!rec})">Preview</button>`:''}</div>
    </div>`;
  }).join('');
}
window.openPreview=(ds,th,id,sent)=>{weekPreview={ds,th,id,sent,from:tab};render();window.scrollTo(0,0);};
function renderPreview(){
  const {ds,th,id,sent}=weekPreview;const b=byId[id];
  const d=new Date(ds+'T12:00:00');
  const nice=d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  const past=ds<fmtDate(new Date());
  const pill=sent?'<span class="pill sent">Sent ✓</span>':(past?'<span class="pill miss">Not logged</span>':'<span class="pill up">Queued</span>');
  el('content').innerHTML=`
    <button class="btn ghost" onclick="weekPreview=null;render()">← Back</button>
    <div class="eyebrow" style="margin-top:16px">${DAYNAME[th]}</div>
    <h1 style="margin:6px 0 6px">${nice}</h1>
    <div style="margin-bottom:18px">${pill}${(!sent&&past)?'<span class="sub" style="margin-left:10px">was queued for this day — no send was logged</span>':''}</div>
    ${b?byteCard(b):'<div class="card prose">This entry was logged under an earlier data version; its text is not on file.</div>'}`;
}
/* ---------- Quiz Friday ---------- */
function quizHero(){
  if(quizState.loading)return `<div class="card prose"><span class="spinner"></span>Writing three fresh questions from this week's news…</div>`;
  if(quizState.options)return `<div class="sub" style="margin-bottom:4px">Pick one — copying logs it automatically.</div>`+
    quizState.options.map((o,i)=>`<div class="card hero lift a-QUIZ" style="margin-top:14px">
      <div class="copyline">BEATBytes {DH &lt;GO&gt;} "Quiz Friday"</div>
      <div class="msgtext">${esc(o)}</div>
      <div class="actions"><button class="btn primary" onclick="useQuiz(${i})">Copy &amp; mark sent</button></div>
    </div>`).join('')+`<div style="margin-top:14px"><button class="btn quiet" onclick="genQuiz()">Regenerate</button></div>`;
  return `<div class="card prose a-QUIZ">
    <h3>Quiz Friday</h3>
    <p>Generate three fresh options from this week's markets news, pick one and copy it straight to the chat.</p>
    <div class="actions"><button class="btn primary" onclick="genQuiz()">Generate today's quiz</button></div>
    ${quizState.error?`<div class="flagline" style="color:var(--red)">${esc(quizState.error)}</div>`:''}
  </div>`;
}
window.genQuiz=async function(){
  quizState={loading:true,options:null,error:null};render();
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,
        tools:[{type:'web_search_20250305',name:'web_search'}],
        messages:[{role:'user',content:"You write BEATBytes, a daily one-paragraph note to Berenberg's electronic trading clients (European equities). Today is Quiz Friday, "+new Date().toDateString()+". Search the web for this week's notable markets/finance news, then write exactly 3 candidate quiz questions: (1) a European market-structure or TCA knowledge question, (2) one tied to this week's actual market news, (3) a lighter pop-culture-crossover with a markets angle. Each option: one short question, choices A-D on separate lines, then 'Answer:' with the letter and a one-line explanation. Separate the three options with a line containing only '@@@'. Output nothing else - no preamble."}]})});
    const data=await res.json();
    if(data.error) throw new Error(data.error.message||'API error');
    const text=(data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n');
    const opts=text.split('@@@').map(s=>s.trim()).filter(s=>s.length>40).slice(0,3);
    if(!opts.length) throw new Error('No questions returned — try again');
    quizState={loading:false,options:opts,error:null};
  }catch(e){quizState={loading:false,options:null,error:'Could not generate ('+e.message+'). Try again shortly.'};}
  render();
};
window.useQuiz=async function(i){
  const q=quizState.options[i];
  await copyText(`BEATBytes {DH <GO>} "Quiz Friday"\n\n`+q);
  const id='QUIZ-GEN-'+fmtDate(new Date()),t=fmtDate(new Date());
  if(!liveLog.find(s=>s.date===t&&s.id===id)){liveLog.push({date:t,id});await saveLog();}
  quizState={loading:false,options:null,error:null};
  toast(storageOkMsg());
  render();
};
/* ---------- LIBRARY ---------- */
let lib={q:'',openDay:null,openTopics:{},openBytes:{}};
function renderLibrary(){
  const ls=lastSentMap();
  let head=`<div style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap">
    <div><div class="eyebrow">Library</div><h1 style="margin-top:6px">All bytes by day &amp; topic</h1></div>
    </div>`;
  head+=`<div style="margin:16px 0 4px"><input class="search" placeholder="Search titles, topics or content…" value="${esc(lib.q)}" oninput="lib.q=this.value;render();this===document.activeElement||this.focus()" autocomplete="off"></div>`;
  const q=lib.q.trim().toLowerCase();
  const blocks=THEMES.map(th=>{
    let list=DATA.bytes.filter(b=>b.theme===th);
    if(q)list=list.filter(b=>(b.title+' '+b.text+' '+b.topic).toLowerCase().includes(q));
    if(!list.length)return '';
    const open=q?true:lib.openDay===th;
    const col={MKT:'var(--mon)',TCA:'var(--tue)',ALGO:'var(--wed)',BEATBOT:'var(--thu)'}[th];
    let inner='';
    if(open){
      const topics=DATA.topics[th].filter(tp=>list.some(b=>b.topic===tp));
      inner=topics.map(tp=>{
        const rows=list.filter(b=>b.topic===tp);
        const topen=q?true:!!lib.openTopics[th+'|'+tp];
        return `<div class="topichead" onclick="lib.openTopics['${th}|${esc(tp)}']=!lib.openTopics['${th}|${esc(tp)}'];render()">
            <span class="chev" style="${topen?'transform:rotate(90deg)':''}">▶</span>${esc(tp)} <span class="cnt">· ${rows.length}</span></div>`+
          (topen?rows.map(b=>{
            const bopen=!!lib.openBytes[b.id];
            return `<div class="byterow" onclick="lib.openBytes['${b.id}']=!lib.openBytes['${b.id}'];render()">
              <div class="t"><span class="idc">${b.id}</span><b>${esc(b.title)}</b>
              ${b.template?'<span class="pill tpl">needs figures</span>':''}
              ${b.chart?'<span class="pill chart">needs chart</span>':''}
              </div></div>`+
              (bopen?`<div class="bytebody">
                 <div class="copyline" style="margin-top:12px">BEATBytes {DH &lt;GO&gt;} "${esc(b.title)}"</div>
                 <div class="msgtext">${esc(b.text)}</div>
                 ${b.template?'<div class="flagline">Figures appear as [brackets] / x placeholders — fill in before sending until Qlik is linked.</div>':''}
                 ${b.chart?'<div class="flagline" style="color:var(--accent)">References a chart — attach manually until Qlik is linked.</div>':''}
                 <div class="actions">
                   <button class="btn primary" onclick="event.stopPropagation();copyOnly('${b.id}')">Copy</button>
                   <button class="btn quiet" onclick="event.stopPropagation();copySend('${b.id}')">Copy &amp; mark sent</button>
                 </div></div>`:'');
          }).join(''):'');
      }).join('');
    }
    return `<div class="card dayblock ${open?'open':''}">
      <div class="dayhead" onclick="lib.openDay=lib.openDay==='${th}'?null:'${th}';render()">
        <span class="chev">▶</span><span class="dd" style="background:${col}"></span>
        <b>${DAYNAME[th]}</b><span class="cnt">${list.length} bytes · ${DATA.topics[th].length} topics</span>
      </div>${inner}</div>`;
  }).join('');
  el('content').innerHTML=head+blocks+(q&&!blocks.trim()?'<div class="card prose" style="margin-top:16px">No matches.</div>':'');
}
function renderLog(ls){
  const rows=allSends().slice().sort((a,b)=>b.date.localeCompare(a.date));
  return `<div class="card" style="margin-top:18px"><table class="log">
    <tr><th>Date</th><th>Byte</th><th>Title</th></tr>
    ${rows.map(s=>{const b=byId[s.id];return `<tr><td>${s.date}</td><td class="idc">${esc(s.id)}</td><td>${b?esc(b.title):(String(s.id).startsWith('QUIZ-GEN')?'Generated quiz':'Earlier data version')}</td></tr>`}).join('')}
  </table></div>`;
}
/* ---------- SEND LOG TAB ---------- */
function renderLogTab(){
  const rows=allSends().slice().sort((a,b)=>b.date.localeCompare(a.date));
  el('content').innerHTML=`<div class="eyebrow">Send log</div><h1 style="margin:6px 0 4px">Every send, newest first</h1>
    <p class="sub" style="margin-bottom:16px">${rows.length} sends on record. Updates automatically the moment “Copy &amp; mark sent” is pressed.${logMode==='shared'?' Shared live across the whole team.':(logMode==='local'?' Running outside Claude — log is saved on this machine only.':'')}</p>
    <div class="card"><table class="log">
    <tr><th>Date</th><th>Byte</th><th>Title</th></tr>
    ${rows.map(s=>{const b=byId[s.id];return `<tr><td>${s.date}</td><td class="idc">${esc(s.id)}</td><td>${b?esc(b.title):(String(s.id).startsWith('QUIZ-GEN')?'Generated quiz':'Earlier data version')}</td></tr>`}).join('')}
    </table></div>`;
}
/* ---------- SCHEDULE ---------- */
function sentThisWeek(th){
  const mon=weekMonday(new Date());const monS=fmtDate(mon);
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);const sunS=fmtDate(sun);
  return allSends().some(s=>{const b=byId[s.id];return s.date>=monS&&s.date<=sunS&&((b&&b.theme===th)||(th==='QUIZ'&&String(s.id).startsWith('QUIZ')));});
}
function renderSchedule(){
  if(weekPreview&&weekPreview.from==='schedule'){renderPreview();return;}
  if(weekPreview)weekPreview=null;
  const mon=weekMonday(new Date());const nmon=new Date(mon);nmon.setDate(mon.getDate()+7);
  const order=['MKT','TCA','ALGO','BEATBOT','QUIZ'];
  const rows=order.map((th,i)=>{
    const d=new Date(nmon);d.setDate(nmon.getDate()+i);const ds=fmtDate(d);
    let main,act='';
    if(th==='QUIZ'){
      main=`<b>Quiz Friday</b><span>Three fresh options generated from that week's news</span>`;
    } else {
      const rot=rotation(th);
      const id=sentThisWeek(th)?rot[0]:(rot[1]??rot[0]);
      const b=byId[id];
      main=`<b>${b?esc(b.title):'\u2014'}</b><span>${b?`<span class="idc">${b.id}</span> \u00b7 ${esc(b.text.slice(0,110))}\u2026`:''}</span>`;
      if(b)act=`<button class="btn ghost" onclick="openPreview('${ds}','${th}','${b.id}',false)">Preview</button>`;
    }
    return `<div class="wkrow">
      <div class="wkday"><b>${d.toLocaleDateString('en-GB',{weekday:'long'})}</b><span>${d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span></div>
      <span class="thcol"><span class="pill ${th}">${DAYNAME[th].split(' ').slice(0,-1).join(' ')||'Quiz'}</span></span>
      <div class="wkmain">${main}</div>
      <div class="wkact"><span class="pill up">Queued</span>${act}</div>
    </div>`;
  }).join('');
  el('content').innerHTML=`<div class="eyebrow">Upcoming schedule</div><h1 style="margin:6px 0 18px">Next week</h1>
    <div class="card">${rows}</div>
    <p class="sub" style="margin-top:14px">Projected from the live rotation \u2014 sends logged this week roll the queue forward automatically.</p>`;
}
/* ---------- ABOUT ---------- */
function renderAbout(){
  const n=DATA.bytes.length;
  const sends=allSends().length;
  const topicsN=THEMES.reduce((a,t)=>a+DATA.topics[t].length,0);
  const DAYS=[
    ['MKT','Monday','Market Structure',"Facts and stats on the European trading landscape \u2014 venues, volumes, auctions, dark trading and regulation."],
    ['TCA','Tuesday','TCA',"Measuring the cost and quality of execution \u2014 benchmarks, mark-outs, alpha and methodology."],
    ['ALGO','Wednesday','Algo Stack',"How to get the most from BEAT strategies \u2014 parameters, defaults, customisations and tips."],
    ['BEATBOT','Thursday','BEATBOT',"Berenberg's alerting suite \u2014 real-time heads-ups on orders, liquidity and auctions, delivered to Bloomberg."],
    ['QUIZ','Friday','Quiz',"A lighter close to the week \u2014 generated fresh each Friday from that week's markets news."]];
  const STEPS=[
    ['1','Open Today',"The next byte in the rotation is ready, in the exact client format."],
    ['2','Copy \u0026 mark sent',"The message lands on your clipboard and the send is logged instantly for the whole team."],
    ['3','Want something else?',"Swap through the queue, or pick anything from the Library \u2014 organised day \u2192 topic \u2192 byte, exactly as the master workbook."]];
  el('content').innerHTML=`<div class="eyebrow">About</div><h1 style="margin:6px 0 4px">The BEATBytes desk console</h1>
  <div class="statgrid">
    <div class="stat"><div class="n">${n}</div><div class="l">Bytes on file</div></div>
    <div class="stat"><div class="n" style="color:var(--mon)">${topicsN}</div><div class="l">Topics</div></div>
    <div class="stat"><div class="n" style="color:var(--fri)">${sends}</div><div class="l">Sends logged</div></div>
  </div>
  <div class="card prose">
    <h3>What this is</h3>
    <p>BEATBytes is the desk's daily one-paragraph note to electronic trading clients, sent at 10:30 via Bloomberg chat. This console holds the full curated library, tells you exactly what to send today, and keeps a shared send log so the whole team sees the same rotation.</p>
    <h3>The week</h3>
    ${DAYS.map(([th,day,name,txt])=>`<div style="display:flex;gap:14px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--hair)">
      <span class="thcol"><span class="pill ${th}">${day}</span></span>
      <div><b>${name}</b><div class="sub">${txt}</div></div></div>`).join('')}
    <h3>Copy format</h3>
    <p>Every copy uses the agreed client format:</p>
    <p class="copyline" style="margin-top:8px">BEATBytes {DH &lt;GO&gt;} "Title"<br><br>Content</p>
    <h3>Figures &amp; placeholders</h3>
    <p>Bytes built around live numbers carry <span class="kbd">[figure \u2013 update]</span> brackets or <span class="kbd">x</span> placeholders. They rotate like everything else; once the dashboard is linked to Qlik those figures will populate automatically \u2014 until then, drop the current numbers in before sending. Bytes tagged <span class="pill chart">needs chart</span> reference a visual that will also come from Qlik \u2014 attach it manually for now.</p>
    <h3>How to use it</h3>
    ${STEPS.map(([k,t,txt])=>`<div style="display:flex;gap:14px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--hair)">
      <span style="flex:none;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700">${k}</span>
      <div><b>${t}</b><div class="sub">${txt}</div></div></div>`).join('')}
  </div>`;
}
/* ---------- render ---------- */
function render(){nav();({today:renderToday,library:renderLibrary,schedule:renderSchedule,about:renderAbout,log:renderLogTab})[tab]();}
(async()=>{await loadLog();render();})();
</script>
